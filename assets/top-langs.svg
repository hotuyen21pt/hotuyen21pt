<svg xmlns="http://www.w3.org/2000/svg" width="400" height="202" viewBox="0 0 400 202" role="img" aria-label="Most used languages">
  <style>
    svg { --bg:#FFFFFF; --bd:#D8DEE4; --tx:#1F2328; --mu:#636C76; --ac:#0B6FD4; --hi:#7C4DFF; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0D1117; --bd:#1E3A52; --tx:#C9D1D9; --mu:#8B949E; --ac:#36BCF7; --hi:#9D7BFF; }
    }

    .rise { opacity:0; animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { opacity:0; transform: translateY(8px) } to { opacity:1; transform:none } }
    @media (prefers-reduced-motion: reduce) {
      .rise { animation:none; opacity:1 } .wipe { animation:none; width:100% } .shine { display:none }
    }

    .wipe { animation: wipe 1.1s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes wipe { from { width: 0 } to { width: 352px } }
    .shine { animation: shine 3.6s ease-in-out 1.2s infinite; }
    @keyframes shine { 0% { transform: translateX(-90px) } 60%,100% { transform: translateX(380px) } }

    .t { font: 700 16px 'Segoe UI', Ubuntu, -apple-system, sans-serif; fill: var(--ac); letter-spacing:.3px }
    .k { font: 400 14px 'Segoe UI', Ubuntu, -apple-system, sans-serif; fill: var(--tx) }
    .v { font: 700 14px 'Segoe UI', Ubuntu, -apple-system, sans-serif; fill: var(--ac) }
    .s { font: 400 11px 'Segoe UI', Ubuntu, -apple-system, sans-serif; fill: var(--mu) }
  </style>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="var(--ac)"/><stop offset="100%" stop-color="var(--hi)"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="399" height="201" rx="12" fill="var(--bg)" stroke="var(--bd)"/>
  <rect x="0" y="0" width="400" height="3" rx="1.5" fill="url(#edge)"/>
  <text x="24" y="38" class="t">Most used languages</text>
  <defs><clipPath id="barclip"><rect class="wipe" x="24" y="56" width="0" height="12" rx="6"/></clipPath>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".55"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <g clip-path="url(#barclip)">
      <rect x="24.0" y="56" width="152.1" height="12" rx="6" fill="#DA5B0B"/>
      <rect x="176.1" y="56" width="105.3" height="12" rx="0" fill="#3572A5"/>
      <rect x="281.4" y="56" width="58.5" height="12" rx="0" fill="#E34C26"/>
      <rect x="339.9" y="56" width="14.8" height="12" rx="0" fill="#3178C6"/>
      <rect x="354.7" y="56" width="12.7" height="12" rx="0" fill="#00ADD8"/>
      <rect x="367.4" y="56" width="5.3" height="12" rx="0" fill="#663399"/>
      <rect x="372.7" y="56" width="2.9" height="12" rx="0" fill="#F1E05A"/>
      <rect x="375.6" y="56" width="0.4" height="12" rx="6" fill="#384D54"/>
    <rect class="shine" x="24" y="56" width="80" height="12" fill="url(#gloss)"/>
  </g>
  <g class="rise" style="animation-delay:0.90s"><circle cx="29" cy="88" r="5" fill="#DA5B0B"/><text x="41" y="92" class="k">Jupyter Notebook</text><text x="180" y="92" class="v" text-anchor="end">43.2%</text></g>
  <g class="rise" style="animation-delay:0.96s"><circle cx="217" cy="88" r="5" fill="#3572A5"/><text x="229" y="92" class="k">Python</text><text x="368" y="92" class="v" text-anchor="end">29.9%</text></g>
  <g class="rise" style="animation-delay:1.02s"><circle cx="29" cy="112" r="5" fill="#E34C26"/><text x="41" y="116" class="k">HTML</text><text x="180" y="116" class="v" text-anchor="end">16.6%</text></g>
  <g class="rise" style="animation-delay:1.08s"><circle cx="217" cy="112" r="5" fill="#3178C6"/><text x="229" y="116" class="k">TypeScript</text><text x="368" y="116" class="v" text-anchor="end">4.2%</text></g>
  <g class="rise" style="animation-delay:1.14s"><circle cx="29" cy="136" r="5" fill="#00ADD8"/><text x="41" y="140" class="k">Go</text><text x="180" y="140" class="v" text-anchor="end">3.6%</text></g>
  <g class="rise" style="animation-delay:1.20s"><circle cx="217" cy="136" r="5" fill="#663399"/><text x="229" y="140" class="k">CSS</text><text x="368" y="140" class="v" text-anchor="end">1.5%</text></g>
  <g class="rise" style="animation-delay:1.26s"><circle cx="29" cy="160" r="5" fill="#F1E05A"/><text x="41" y="164" class="k">JavaScript</text><text x="180" y="164" class="v" text-anchor="end">0.8%</text></g>
  <g class="rise" style="animation-delay:1.32s"><circle cx="217" cy="160" r="5" fill="#384D54"/><text x="229" y="164" class="k">Dockerfile</text><text x="368" y="164" class="v" text-anchor="end">0.1%</text></g>
</svg>
