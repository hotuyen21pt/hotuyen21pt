<svg xmlns="http://www.w3.org/2000/svg" width="440" height="305" viewBox="0 0 440 305" role="img" aria-label="Most used languages">
  <style>
    svg {
      --bg:#FFFFFF; --panel:#F6F8FA; --bd:#D8DEE4; --tx:#1F2328; --mu:#636C76;
      --ac:#0B6FD4; --hi:#6A3DE8;
      --l0:#E7ECF2; --l1:#BDDCF5; --l2:#6FB7EB; --l3:#2E8FD6; --l4:#0B5FB8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg:#0D1117; --panel:#111823; --bd:#1E3A52; --tx:#C9D1D9; --mu:#8B949E;
        --ac:#36BCF7; --hi:#9D7BFF;
        --l0:#161B22; --l1:#0E3A5C; --l2:#1569A3; --l3:#2E9BE0; --l4:#7FE3FF;
      }
    }

    .mono { font: 400 12.5px 'JetBrains Mono','Cascadia Code','Fira Code',Consolas,'Liberation Mono',monospace }
    .cmd  { font: 400 11px 'JetBrains Mono','Cascadia Code',Consolas,monospace; fill: var(--mu) }
    .k    { fill: var(--mu) }
    .v    { fill: var(--tx); font-weight: 700 }
    .ac   { fill: var(--ac) }
    .s    { font: 400 10.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace; fill: var(--mu) }
    .big  { font: 700 17px 'Segoe UI',Ubuntu,-apple-system,sans-serif; fill: var(--ac) }
    .rise { opacity:0; animation: rise .5s cubic-bezier(.2,.8,.2,1) both }
    @keyframes rise { from { opacity:0; transform: translateY(6px) } to { opacity:1; transform:none } }
    .blink { animation: blink 1.1s steps(1) infinite }
    @keyframes blink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
    @media (prefers-reduced-motion: reduce) {
      .rise,.blink,.wipe,.shine,.fly,.col,.beam { animation: none !important; opacity: 1 }
      .wipe { width: 100% } .shine,.beam { display: none }
    }

    .wipe { animation: wipe 1.1s cubic-bezier(.2,.8,.2,1) both }
    @keyframes wipe { from { width: 0 } to { width: 392px } }
    .grow { transform-origin: 208px 0; animation: grow .9s cubic-bezier(.2,.8,.2,1) both }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    @media (prefers-reduced-motion: reduce) { .grow { animation: none } }
</style>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="var(--ac)"/><stop offset="100%" stop-color="var(--hi)"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="440" height="305" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="440" height="305" fill="var(--bg)"/>
    <rect width="440" height="34" fill="var(--panel)"/>
    <rect y="33" width="440" height="1" fill="var(--bd)"/>
    <rect width="440" height="2" fill="url(#edge)"/>
    <circle cx="20" cy="18" r="4" fill="#FF5F57"/>
    <circle cx="34" cy="18" r="4" fill="#FEBC2E"/>
    <circle cx="48" cy="18" r="4" fill="#28C840"/>
    <text x="66" y="22" class="cmd">~/hotuyen21pt $ gh loadout --languages</text>
    <defs><clipPath id="barclip"><rect class="wipe" x="24" y="58" width="0" height="14" rx="7"/></clipPath></defs>
    <g clip-path="url(#barclip)">
      <rect x="24.0" y="58" width="202.9" height="14" rx="7" fill="#DA5B0B"/>
      <rect x="228.9" y="58" width="127.4" height="14" rx="0" fill="#3572A5"/>
      <rect x="358.3" y="58" width="24.4" height="14" rx="0" fill="#E34C26"/>
      <rect x="384.7" y="58" width="5.9" height="14" rx="0" fill="#F1E05A"/>
      <rect x="392.6" y="58" width="5.3" height="14" rx="0" fill="#3D6117"/>
      <rect x="399.9" y="58" width="4.4" height="14" rx="0" fill="#3178C6"/>
      <rect x="406.3" y="58" width="3.6" height="14" rx="0" fill="#00ADD8"/>
      <rect x="411.9" y="58" width="2.1" height="14" rx="7" fill="#663399"/>
    </g>
    <g class="rise" style="animation-delay:0.55s"><rect x="24" y="95" width="9" height="9" rx="2" fill="#DA5B0B"/><text x="41" y="104" class="mono k">Jupyter Notebook</text><rect x="208" y="97" width="150" height="6" rx="3" fill="var(--bd)" opacity=".55"/><rect class="grow" style="animation-delay:0.60s" x="208" y="97" width="150.0" height="6" rx="3" fill="#DA5B0B"/><text x="416" y="104" class="mono v" text-anchor="end">52.3%</text></g>
    <g class="rise" style="animation-delay:0.60s"><rect x="24" y="120" width="9" height="9" rx="2" fill="#3572A5"/><text x="41" y="129" class="mono k">Python</text><rect x="208" y="122" width="150" height="6" rx="3" fill="var(--bd)" opacity=".55"/><rect class="grow" style="animation-delay:0.65s" x="208" y="122" width="94.7" height="6" rx="3" fill="#3572A5"/><text x="416" y="129" class="mono v" text-anchor="end">33.0%</text></g>
    <g class="rise" style="animation-delay:0.65s"><rect x="24" y="145" width="9" height="9" rx="2" fill="#E34C26"/><text x="41" y="154" class="mono k">HTML</text><rect x="208" y="147" width="150" height="6" rx="3" fill="var(--bd)" opacity=".55"/><rect class="grow" style="animation-delay:0.70s" x="208" y="147" width="19.3" height="6" rx="3" fill="#E34C26"/><text x="416" y="154" class="mono v" text-anchor="end">6.7%</text></g>
    <g class="rise" style="animation-delay:0.70s"><rect x="24" y="170" width="9" height="9" rx="2" fill="#F1E05A"/><text x="41" y="179" class="mono k">JavaScript</text><rect x="208" y="172" width="150" height="6" rx="3" fill="var(--bd)" opacity=".55"/><rect class="grow" style="animation-delay:0.75s" x="208" y="172" width="5.8" height="6" rx="3" fill="#F1E05A"/><text x="416" y="179" class="mono v" text-anchor="end">2.0%</text></g>
    <g class="rise" style="animation-delay:0.75s"><rect x="24" y="195" width="9" height="9" rx="2" fill="#3D6117"/><text x="41" y="204" class="mono k">TeX</text><rect x="208" y="197" width="150" height="6" rx="3" fill="var(--bd)" opacity=".55"/><rect class="grow" style="animation-delay:0.80s" x="208" y="197" width="5.4" height="6" rx="3" fill="#3D6117"/><text x="416" y="204" class="mono v" text-anchor="end">1.9%</text></g>
    <g class="rise" style="animation-delay:0.80s"><rect x="24" y="220" width="9" height="9" rx="2" fill="#3178C6"/><text x="41" y="229" class="mono k">TypeScript</text><rect x="208" y="222" width="150" height="6" rx="3" fill="var(--bd)" opacity=".55"/><rect class="grow" style="animation-delay:0.85s" x="208" y="222" width="4.7" height="6" rx="3" fill="#3178C6"/><text x="416" y="229" class="mono v" text-anchor="end">1.6%</text></g>
    <g class="rise" style="animation-delay:0.85s"><rect x="24" y="245" width="9" height="9" rx="2" fill="#00ADD8"/><text x="41" y="254" class="mono k">Go</text><rect x="208" y="247" width="150" height="6" rx="3" fill="var(--bd)" opacity=".55"/><rect class="grow" style="animation-delay:0.90s" x="208" y="247" width="4.1" height="6" rx="3" fill="#00ADD8"/><text x="416" y="254" class="mono v" text-anchor="end">1.4%</text></g>
    <g class="rise" style="animation-delay:0.90s"><rect x="24" y="270" width="9" height="9" rx="2" fill="#663399"/><text x="41" y="279" class="mono k">CSS</text><rect x="208" y="272" width="150" height="6" rx="3" fill="var(--bd)" opacity=".55"/><rect class="grow" style="animation-delay:0.95s" x="208" y="272" width="3.0" height="6" rx="3" fill="#663399"/><text x="416" y="279" class="mono v" text-anchor="end">1.0%</text></g>
  </g>
  <rect x="0.5" y="0.5" width="439" height="304" rx="12" fill="none" stroke="var(--bd)"/>
</svg>
