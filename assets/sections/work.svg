<svg xmlns="http://www.w3.org/2000/svg" width="830" height="62" viewBox="0 0 830 62" role="img" aria-label="Featured work">
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" style="stop-color:var(--ac)"/>
      <stop offset="45%" style="stop-color:var(--hi)"/>
      <stop offset="100%" style="stop-color:var(--hi);stop-opacity:0"/>
    </linearGradient>
  </defs>
  <style>
    svg { --bg:#FFFFFF; --panel:#F6F8FA; --bd:#D8DEE4; --ink:#1F2328; --tx:#3D4752; --mu:#636C76;
          --ac:#0B6FD4; --hi:#6A3DE8 }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0D1117; --panel:#111823; --bd:#1E3A52; --ink:#F0F6FC; --tx:#C3CDD8; --mu:#8B949E;
            --ac:#36BCF7; --hi:#9D7BFF }
    }

    .no { font: 700 12px 'JetBrains Mono','Cascadia Code',Consolas,monospace; fill: var(--ac); letter-spacing: 1.5px }
    .tt { font: 800 25px 'Segoe UI',Ubuntu,-apple-system,sans-serif; fill: var(--ink) }
    .hn { font: 500 10.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace; fill: var(--mu); letter-spacing: .4px }
    .rl { stroke-dasharray: 830; stroke-dashoffset: 830; animation: draw 1.2s .15s cubic-bezier(.22,1,.36,1) forwards }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .in { animation: in .6s cubic-bezier(.22,1,.36,1) both }
    @keyframes in { from { opacity:0; transform: translateX(-8px) } to { opacity:1; transform:none } }
    @media (prefers-reduced-motion: reduce) { .rl,.in { animation: none } .rl { stroke-dashoffset: 0 } }
  </style>
  <g class="in">
    <text x="0" y="17" class="no">03 / 04</text>
    <text x="0" y="46" class="tt">Featured work</text>
  </g>
  <text x="830" y="46" text-anchor="end" class="hn">click a card to open the repo</text>
  <line class="rl" x1="0" y1="59" x2="830" y2="59" stroke="url(#rule)" stroke-width="2" stroke-linecap="round"/>
</svg>
