<svg xmlns="http://www.w3.org/2000/svg" width="830" height="56" viewBox="0 0 830 56" role="img" aria-label="Technology arsenal">
  <style>
    svg { --bg:#FFFFFF; --panel:#F6F8FA; --bd:#D8DEE4; --ink:#1F2328; --tx:#3D4752; --mu:#636C76;
          --ac:#0B6FD4; --hi:#6A3DE8 }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0D1117; --panel:#111823; --bd:#1E3A52; --ink:#F0F6FC; --tx:#C3CDD8; --mu:#8B949E;
            --ac:#36BCF7; --hi:#9D7BFF }
    }

    .no { font: 700 12px 'JetBrains Mono','Cascadia Code',Consolas,monospace; fill: var(--ac); letter-spacing: 1.5px }
    .tt { font: 800 25px 'Segoe UI',Ubuntu,-apple-system,sans-serif; fill: var(--ink) }
    .fr { opacity:0; fill: var(--ac); animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: linear }
    .fin { animation: fin 9s linear infinite }
    .hn { font: 500 10.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace; fill: var(--mu); letter-spacing: .4px }
    .in { animation: in .6s cubic-bezier(.22,1,.36,1) both }
    @keyframes in { from { opacity:0; transform: translateX(-8px) } to { opacity:1; transform:none } }
        @keyframes f0 { 0%,0.00% { opacity:0 } 0.01%,1.00% { opacity:1 } 1.01%,100% { opacity:0 } }
    @keyframes f1 { 0%,1.00% { opacity:0 } 1.01%,2.00% { opacity:1 } 2.01%,100% { opacity:0 } }
    @keyframes f2 { 0%,2.00% { opacity:0 } 2.01%,3.00% { opacity:1 } 3.01%,100% { opacity:0 } }
    @keyframes f3 { 0%,3.00% { opacity:0 } 3.01%,4.00% { opacity:1 } 4.01%,100% { opacity:0 } }
    @keyframes f4 { 0%,4.00% { opacity:0 } 4.01%,5.00% { opacity:1 } 5.01%,100% { opacity:0 } }
    @keyframes f5 { 0%,5.00% { opacity:0 } 5.01%,6.00% { opacity:1 } 6.01%,100% { opacity:0 } }
    @keyframes f6 { 0%,6.00% { opacity:0 } 6.01%,7.00% { opacity:1 } 7.01%,100% { opacity:0 } }
    @keyframes f7 { 0%,7.00% { opacity:0 } 7.01%,8.00% { opacity:1 } 8.01%,100% { opacity:0 } }
    @keyframes fin { 0%,8.00% { opacity:0 } 8.01%,100% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) { .in,.fin { animation: none } .fr { display: none } }
  </style>
  <g class="in">
    <text x="0" y="17" class="no">02 / 04</text>
        <text x="0" y="46" class="tt fr" style="animation-name:f0">/E*KY0S34# 32ZK&gt;G&gt;</text>
    <text x="0" y="46" class="tt fr" style="animation-name:f1">TeL2H&gt;&amp;P%G %KY5TFP</text>
    <text x="0" y="46" class="tt fr" style="animation-name:f2">TechP15L4Q 6PFX3#%</text>
    <text x="0" y="46" class="tt fr" style="animation-name:f3">Techno0S27 %L287V&lt;</text>
    <text x="0" y="46" class="tt fr" style="animation-name:f4">TechnologY 2&lt;%TKWW</text>
    <text x="0" y="46" class="tt fr" style="animation-name:f5">Technology 26T%HW&gt;</text>
    <text x="0" y="46" class="tt fr" style="animation-name:f6">Technology ar7L1XF</text>
    <text x="0" y="46" class="tt fr" style="animation-name:f7">Technology arseFNX</text>
    <text x="0" y="46" class="tt fin">Technology arsenal</text>
  </g>
  <text x="830" y="46" text-anchor="end" class="hn">click a row to open it</text>
</svg>
