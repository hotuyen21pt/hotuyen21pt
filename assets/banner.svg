    <circle cx="442" cy="115" r="0.9" fill="var(--star)" opacity="0.81" class="twinkle" style="animation-duration:3.4s;animation-delay:2.8s"/>
    <circle cx="396" cy="124" r="1.4" fill="var(--star)" opacity="0.28" class="twinkle" style="animation-duration:3.6s;animation-delay:4.3s"/>
    <circle cx="590" cy="18" r="0.9" fill="var(--star)" opacity="0.35" class="twinkle" style="animation-duration:2.7s;animation-delay:1.7s"/>
    <circle cx="803" cy="287" r="1.4" fill="var(--star)" opacity="0.28" class="twinkle" style="animation-duration:3.0s;animation-delay:3.3s"/>
    <circle cx="814" cy="144" r="0.9" fill="var(--star)" opacity="0.79" class="twinkle" style="animation-duration:3.9s;animation-delay:0.8s"/>
    <circle cx="334" cy="227" r="1.4" fill="var(--star)" opacity="0.60" class="twinkle" style="animation-duration:5.9s;animation-delay:1.5s"/>
    <circle cx="480" cy="86" r="0.7" fill="var(--star)" opacity="0.48" class="twinkle" style="animation-duration:2.9s;animation-delay:3.6s"/>
    <circle cx="242" cy="101" r="0.9" fill="var(--star)" opacity="0.76" class="twinkle" style="animation-duration:4.8s;animation-delay:1.3s"/>
    <circle cx="367" cy="280" r="0.9" fill="var(--star)" opacity="0.33" class="twinkle" style="animation-duration:2.8s;animation-delay:0.5s"/>
    <circle cx="30" cy="135" r="0.9" fill="var(--star)" opacity="0.29" class="twinkle" style="animation-duration:2.9s;animation-delay:1.4s"/>
