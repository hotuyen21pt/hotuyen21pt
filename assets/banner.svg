<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Tuyen Ho Nguyen - NLP Research, Multimodal AI, ML Engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--sky0)"/>
      <stop offset="52%" stop-color="var(--sky1)"/>
      <stop offset="100%" stop-color="var(--sky0)"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="var(--hi)"/>
      <stop offset="42%" stop-color="var(--ac)"/>
      <stop offset="52%" stop-color="var(--ink)"/>
      <stop offset="100%" stop-color="var(--ac)"/>
      <animate attributeName="x1" values="-1;0;-1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="var(--ac)" stop-opacity="0"/>
      <stop offset="45%" stop-color="var(--ac)" stop-opacity="1"/>
      <stop offset="100%" stop-color="var(--hi)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="thrust" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="var(--ac)" stop-opacity=".85"/>
      <stop offset="100%" stop-color="var(--ac)" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nebA">
      <stop offset="0%" stop-color="var(--ac)" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="var(--ac)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebB">
      <stop offset="0%" stop-color="var(--hi)" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="var(--hi)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="var(--ac)" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="900" height="300" rx="16"/></clipPath>
    <clipPath id="c0"><rect class="r0" x="78" y="211" width="0" height="24"/></clipPath>
    <clipPath id="c1"><rect class="r1" x="78" y="211" width="0" height="24"/></clipPath>
    <clipPath id="c2"><rect class="r2" x="78" y="211" width="0" height="24"/></clipPath>
    <clipPath id="c3"><rect class="r3" x="78" y="211" width="0" height="24"/></clipPath>
  </defs>

  <style>
    svg {
      --sky0:#F4F8FE; --sky1:#DCE8FA; --ink:#0B1F33; --dim:#4A6076;
      --ac:#0B6FD4; --hi:#6A3DE8; --star:#2B4A68; --bd:#C9D6E5; --glass:#FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --sky0:#05070F; --sky1:#0C1A33; --ink:#E8F2FF; --dim:#8FB3C9;
        --ac:#36BCF7; --hi:#7C4DFF; --star:#FFFFFF; --bd:#1E3A52; --glass:#0D1117;
      }
    }

    .name { font: 800 48px 'Segoe UI',Ubuntu,-apple-system,Helvetica,sans-serif;
             letter-spacing: 2.6px; fill: url(#sheen) }
    .role { font: 600 14px 'Segoe UI',Ubuntu,-apple-system,sans-serif;
             letter-spacing: 3.6px; fill: var(--dim); text-transform: uppercase }
    .mono { font: 500 16px 'JetBrains Mono','Cascadia Code','Fira Code',Consolas,monospace }
    .chip { font: 400 11.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace; fill: var(--dim) }
    .typed { fill: var(--ink) }
    .prompt, .caret { fill: var(--ac) }
    .hud { fill: none; stroke: var(--ac); stroke-opacity: .45; stroke-width: 2; stroke-linecap: round }

    .line { opacity: 0 }
    .r0 { animation: t0 16.0s steps(44) infinite 0.00s }
    @keyframes t0 { 0%{width:0} 13.0%{width:427px} 21.0%{width:427px} 25.0%{width:0} 100%{width:0} }
    .k0 { animation: c0 16.0s steps(44) infinite 0.00s, blink 1.05s steps(1) infinite }
    @keyframes c0 { 0%{x:78px} 13.0%{x:505px} 21.0%{x:505px} 25.0%{x:78px} 100%{x:78px} }
    .l0 { animation: show 16.0s linear infinite 0.00s }
    .r1 { animation: t1 16.0s steps(41) infinite 4.00s }
    @keyframes t1 { 0%{width:0} 13.0%{width:398px} 21.0%{width:398px} 25.0%{width:0} 100%{width:0} }
    .k1 { animation: c1 16.0s steps(41) infinite 4.00s, blink 1.05s steps(1) infinite }
    @keyframes c1 { 0%{x:78px} 13.0%{x:476px} 21.0%{x:476px} 25.0%{x:78px} 100%{x:78px} }
    .l1 { animation: show 16.0s linear infinite 4.00s }
    .r2 { animation: t2 16.0s steps(48) infinite 8.00s }
    @keyframes t2 { 0%{width:0} 13.0%{width:466px} 21.0%{width:466px} 25.0%{width:0} 100%{width:0} }
    .k2 { animation: c2 16.0s steps(48) infinite 8.00s, blink 1.05s steps(1) infinite }
    @keyframes c2 { 0%{x:78px} 13.0%{x:544px} 21.0%{x:544px} 25.0%{x:78px} 100%{x:78px} }
    .l2 { animation: show 16.0s linear infinite 8.00s }
    .r3 { animation: t3 16.0s steps(44) infinite 12.00s }
    @keyframes t3 { 0%{width:0} 13.0%{width:427px} 21.0%{width:427px} 25.0%{width:0} 100%{width:0} }
    .k3 { animation: c3 16.0s steps(44) infinite 12.00s, blink 1.05s steps(1) infinite }
    @keyframes c3 { 0%{x:78px} 13.0%{x:505px} 21.0%{x:505px} 25.0%{x:78px} 100%{x:78px} }
    .l3 { animation: show 16.0s linear infinite 12.00s }
    @keyframes show { 0%{opacity:1} 24.9%{opacity:1} 25.0%{opacity:0} 100%{opacity:0} }

    @keyframes blink { 0%,50% { opacity: 1 } 51%,100% { opacity: .12 } }

    .twinkle { animation-name: tw; animation-iteration-count: infinite;
                animation-timing-function: ease-in-out }
    @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: .9 } }

    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.8,.2,1) both }
    @keyframes rise { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }

    .pulse { animation: pulse 4.5s ease-in-out infinite }
    @keyframes pulse { 0%,100% { opacity: .7 } 50% { opacity: 1 } }

    .fly { animation: fly 11s linear infinite }
    @keyframes fly { from { transform: translateX(-60px) } to { transform: translateX(970px) } }
    .jet-body { animation: bob 2.6s ease-in-out infinite }
    @keyframes bob { 0%,100% { transform: translateY(-3px) } 50% { transform: translateY(3px) } }

    @media (prefers-reduced-motion: reduce) {
      .line,.caret,.twinkle,.rise,.pulse,.fly,.jet-body,.name { animation: none !important }
      .line,.rise { opacity: 1 }
      .line.l0 { opacity: 1 } .r0 { width: 427px }
      .line.l1,.line.l2,.line.l3 { opacity: 0 }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="300" fill="url(#bg)"/>
    <rect width="900" height="300" fill="url(#grid)"/>

    <ellipse cx="150" cy="70" rx="270" ry="180" fill="url(#nebA)">
      <animate attributeName="cx" values="150;360;150" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;150;70" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="790" cy="230" rx="260" ry="170" fill="url(#nebB)">
      <animate attributeName="cx" values="790;600;790" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="230;130;230" dur="12s" repeatCount="indefinite"/>
    </ellipse>

    <circle cx="154" cy="204" r="1.1" fill="var(--star)" opacity="0.54" class="twinkle" style="animation-duration:3.3s;animation-delay:4.0s"/>
    <circle cx="722" cy="154" r="0.9" fill="var(--star)" opacity="0.72" class="twinkle" style="animation-duration:2.5s;animation-delay:4.7s"/>
    <circle cx="387" cy="49" r="0.9" fill="var(--star)" opacity="0.80" class="twinkle" style="animation-duration:5.2s;animation-delay:2.2s"/>
    <circle cx="888" cy="227" r="1.4" fill="var(--star)" opacity="0.62" class="twinkle" style="animation-duration:2.5s;animation-delay:1.6s"/>
    <circle cx="448" cy="41" r="1.1" fill="var(--star)" opacity="0.26" class="twinkle" style="animation-duration:5.4s;animation-delay:0.4s"/>
    <circle cx="723" cy="14" r="0.9" fill="var(--star)" opacity="0.58" class="twinkle" style="animation-duration:3.8s;animation-delay:2.4s"/>
    <circle cx="173" cy="19" r="0.9" fill="var(--star)" opacity="0.29" class="twinkle" style="animation-duration:3.2s;animation-delay:3.4s"/>
    <circle cx="718" cy="195" r="0.7" fill="var(--star)" opacity="0.32" class="twinkle" style="animation-duration:4.4s;animation-delay:4.1s"/>
    <circle cx="186" cy="270" r="1.4" fill="var(--star)" opacity="0.43" class="twinkle" style="animation-duration:6.3s;animation-delay:2.5s"/>
    <circle cx="289" cy="146" r="1.1" fill="var(--star)" opacity="0.27" class="twinkle" style="animation-duration:2.8s;animation-delay:3.6s"/>
    <circle cx="886" cy="149" r="1.4" fill="var(--star)" opacity="0.29" class="twinkle" style="animation-duration:4.9s;animation-delay:2.6s"/>
    <circle cx="513" cy="98" r="0.7" fill="var(--star)" opacity="0.36" class="twinkle" style="animation-duration:3.1s;animation-delay:1.7s"/>
    <circle cx="828" cy="106" r="1.1" fill="var(--star)" opacity="0.40" class="twinkle" style="animation-duration:3.1s;animation-delay:4.6s"/>
    <circle cx="162" cy="130" r="0.9" fill="var(--star)" opacity="0.66" class="twinkle" style="animation-duration:5.2s;animation-delay:4.5s"/>
