    <circle cx="608" cy="114" r="0.9" fill="var(--star)" opacity="0.41" class="twinkle" style="animation-duration:6.3s;animation-delay:1.6s"/>
    <circle cx="233" cy="248" r="0.9" fill="var(--star)" opacity="0.79" class="twinkle" style="animation-duration:4.5s;animation-delay:1.2s"/>
    <circle cx="616" cy="211" r="0.9" fill="var(--star)" opacity="0.81" class="twinkle" style="animation-duration:4.3s;animation-delay:2.2s"/>
    <circle cx="554" cy="88" r="0.9" fill="var(--star)" opacity="0.65" class="twinkle" style="animation-duration:4.9s;animation-delay:0.5s"/>
    <path d="M18,44 L18,18 L44,18" class="hud"/>
    <path d="M856,18 L882,18 L882,44" class="hud"/>
    <path d="M18,256 L18,282 L44,282" class="hud"/>
    <path d="M856,282 L882,282 L882,256" class="hud"/>

    <g transform="translate(0,62)"><g class="fly"><g class="jet-body">
      <rect x="-30" y="-2" width="24" height="4" rx="2" fill="url(#thrust)"/>
      <path d="M16,0 L-7,-6 L-2,0 L-7,6 Z" fill="var(--ac)"/>
      <path d="M-2,-3 L-13,-11 L-5,-3 Z" fill="var(--hi)"/>
      <path d="M-2,3 L-13,11 L-5,3 Z" fill="var(--hi)"/>
      <circle cx="-5" cy="0" r="2.6" fill="#FFFFFF" opacity=".92"/>
    </g></g></g>

    <g class="rise">
      <text x="48" y="96" class="role">NLP Research &#183; Multimodal AI &#183; ML Engineering</text>
      <text x="46" y="158" class="name">TUYEN HO NGUYEN</text>
      <rect x="48" y="176" width="320" height="2" rx="1" fill="url(#rule)" class="pulse"/>
    </g>

    <text x="48" y="228" class="mono prompt">&#8250;</text>
    <g class="line l0"><g clip-path="url(#c0)"><text x="78" y="228" class="mono typed">target    : aspect sentiment quad prediction</text></g></g>
    <g class="line l1"><g clip-path="url(#c1)"><text x="78" y="228" class="mono typed">payload   : MedGemma-4B + LoRA, soft-GIoU</text></g></g>
    <g class="line l2"><g clip-path="url(#c2)"><text x="78" y="228" class="mono typed">telemetry : 180 tests green, docker builds clean</text></g></g>
    <g class="line l3"><g clip-path="url(#c3)"><text x="78" y="228" class="mono typed">objective : faithful to the paper, then fast</text></g></g>
    <g class="line l0"><rect class="caret k0" y="214" width="9" height="19" rx="1"/></g>
    <g class="line l1"><rect class="caret k1" y="214" width="9" height="19" rx="1"/></g>
    <g class="line l2"><rect class="caret k2" y="214" width="9" height="19" rx="1"/></g>
    <g class="line l3"><rect class="caret k3" y="214" width="9" height="19" rx="1"/></g>

    <g class="rise" style="animation-delay:1.00s"><circle cx="52" cy="258" r="3.2" fill="var(--ac)"/><text x="64" y="262" class="chip">open to research collaboration</text></g>
    <g class="rise" style="animation-delay:1.12s"><circle cx="320" cy="258" r="3.2" fill="var(--hi)"/><text x="332" y="262" class="chip">Ho Chi Minh City, VN</text></g>
    <g class="rise" style="animation-delay:1.24s"><circle cx="588" cy="258" r="3.2" fill="var(--ac)"/><text x="600" y="262" class="chip">reproducible by default</text></g>

    <rect x="0" y="297" width="900" height="3" fill="url(#rule)" class="pulse"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="299" rx="16" fill="none" stroke="var(--bd)"/>
</svg>
