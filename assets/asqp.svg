<svg xmlns="http://www.w3.org/2000/svg" width="830" height="206" viewBox="0 0 830 206" role="img" aria-label="Aspect sentiment quad prediction, demonstrated on three hotel reviews">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="830" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color:var(--ac)"/><stop offset="100%" style="stop-color:var(--hi)"/>
    </linearGradient>
    <clipPath id="win"><rect width="830" height="206" rx="12"/></clipPath>
    <clipPath id="ty0"><rect x="56" y="74" height="34" width="0" style="animation: typ0 21.0s 0.0s infinite both"/></clipPath><clipPath id="ty1"><rect x="56" y="74" height="34" width="0" style="animation: typ1 21.0s 7.0s infinite both"/></clipPath><clipPath id="ty2"><rect x="56" y="74" height="34" width="0" style="animation: typ2 21.0s 14.0s infinite both"/></clipPath>
  </defs>
  <style>
    svg { --bg:#FFFFFF; --panel:#F6F8FA; --bd:#D8DEE4; --ink:#1F2328; --tx:#3D4752; --mu:#636C76;
          --ac:#0B6FD4; --hi:#6A3DE8 }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0D1117; --panel:#111823; --bd:#1E3A52; --ink:#F0F6FC; --tx:#C3CDD8; --mu:#8B949E;
            --ac:#36BCF7; --hi:#9D7BFF }
    }

    .sn { font: 500 18px 'JetBrains Mono','Cascadia Code',Consolas,monospace; fill: var(--ink) }
    .tp { font: 500 13px 'JetBrains Mono','Cascadia Code',Consolas,monospace }
    .lb { font: 700 8.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace; letter-spacing: 1.4px }
    .tg { font: 500 10.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace; fill: var(--mu) }
    .cm { font: 400 11px 'JetBrains Mono','Cascadia Code',Consolas,monospace; fill: var(--mu) }
    .ft { font: 400 10.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace; fill: var(--mu) }
        @keyframes grp { 0% { opacity:0 } 0.71% { opacity:1 } 30.00% { opacity:1 } 32.38%,100% { opacity:0 } }
    .grp { opacity:0; animation: grp 21.0s linear infinite both }
    @keyframes hl { 0%,12.38% { opacity:0; transform: scaleX(0) } 14.29%,100% { opacity:1; transform: scaleX(1) } }
    @keyframes hl2 { 0%,14.29% { opacity:0; transform: scaleX(0) } 16.19%,100% { opacity:1; transform: scaleX(1) } }
    @keyframes tu { 0%,16.19% { opacity:0; transform: translateX(-8px) } 18.57%,100% { opacity:1; transform: none } }
    @keyframes tu2 { 0%,19.52% { opacity:0; transform: translateX(-8px) } 21.90%,100% { opacity:1; transform: none } }
    .hl,.hl2 { transform-box: fill-box; transform-origin: left center }
    .hl { opacity:0; animation: hl 21.0s cubic-bezier(.22,1,.36,1) infinite both }
    .hl2 { opacity:0; animation: hl2 21.0s cubic-bezier(.22,1,.36,1) infinite both }
    .tu { opacity:0; animation: tu 21.0s cubic-bezier(.22,1,.36,1) infinite both }
    .tu2 { opacity:0; animation: tu2 21.0s cubic-bezier(.22,1,.36,1) infinite both }
    @keyframes typ0 { 0% { width:0; animation-timing-function: steps(55, end) } 11.43%,100% { width:605px } }
    @keyframes car0 { 0% { transform:none; animation-timing-function: steps(55, end) } 11.43%,100% { transform: translateX(605px) } }
    @keyframes typ1 { 0% { width:0; animation-timing-function: steps(51, end) } 11.43%,100% { width:561px } }
    @keyframes car1 { 0% { transform:none; animation-timing-function: steps(51, end) } 11.43%,100% { transform: translateX(561px) } }
    @keyframes typ2 { 0% { width:0; animation-timing-function: steps(45, end) } 11.43%,100% { width:495px } }
    @keyframes car2 { 0% { transform:none; animation-timing-function: steps(45, end) } 11.43%,100% { transform: translateX(495px) } }
    @media (prefers-reduced-motion: reduce) {
      .grp,.hl,.hl2,.tu,.tu2 { animation: none !important; opacity: 0 }
      .grp:first-of-type,.grp:first-of-type .hl,.grp:first-of-type .hl2,.grp:first-of-type .tu,.grp:first-of-type .tu2 { opacity: 1 }
    }
  </style>
  <g clip-path="url(#win)">
    <rect width="830" height="206" fill="var(--bg)"/>
    <rect width="830" height="34" fill="var(--panel)"/>
    <rect y="33" width="830" height="1" fill="var(--bd)"/>
    <rect width="830" height="2" fill="url(#edge)"/>
    <circle cx="20" cy="18" r="4" fill="#FF5F57"/><circle cx="34" cy="18" r="4" fill="#FEBC2E"/><circle cx="48" cy="18" r="4" fill="#28C840"/>
    <text x="66" y="22" class="cm">~/hotuyen21pt $ asqp --live "hotel review"</text>
    <text x="30" y="96" class="sn" fill="var(--ac)" style="fill:var(--ac)">›</text>
  <g class="grp" style="animation-delay:0.0s">
    <text x="806" y="56" text-anchor="end" class="tg">1/3 · english</text>
    <g class="hl" style="animation-delay:0.0s"><rect x="98.0" y="77" width="48.0" height="26" rx="5" fill="var(--ac)" fill-opacity=".14"/><rect x="100.0" y="102" width="44.0" height="2.5" rx="1.2" fill="var(--ac)"/><text x="100.0" y="70" class="lb" fill="var(--ac)">ASPECT</text></g><g class="hl" style="animation-delay:0.0s"><rect x="197.0" y="77" width="92.0" height="26" rx="5" fill="var(--hi)" fill-opacity=".16" stroke="var(--hi)" stroke-opacity=".5"/><text x="199.0" y="70" class="lb" fill="var(--hi)">OPINION</text></g><g class="hl2" style="animation-delay:0.0s"><rect x="384.0" y="77" width="103.0" height="26" rx="5" fill="var(--ac)" fill-opacity=".14"/><rect x="386.0" y="102" width="99.0" height="2.5" rx="1.2" fill="var(--ac)"/><text x="386.0" y="70" class="lb" fill="var(--ac)">ASPECT</text></g><g class="hl2" style="animation-delay:0.0s"><rect x="538.0" y="77" width="114.0" height="26" rx="5" fill="var(--hi)" fill-opacity=".16" stroke="var(--hi)" stroke-opacity=".5"/><text x="540.0" y="70" class="lb" fill="var(--hi)">OPINION</text></g>
    <text x="56" y="96" class="sn" textLength="605" lengthAdjust="spacingAndGlyphs" clip-path="url(#ty0)">The room was spotless but the breakfast was overpriced.</text>
    <rect x="57" y="79" width="2" height="22" fill="var(--ac)" style="animation: car0 21.0s 0.0s infinite both"/>
    <text x="56" y="138" class="tp tu" style="animation-delay:0.0s"><tspan fill="var(--mu)">→ (</tspan><tspan fill="var(--ac)">room</tspan><tspan fill="var(--mu)">, </tspan><tspan fill="var(--hi)">spotless</tspan><tspan fill="var(--mu)">, </tspan><tspan fill="var(--ink)">ROOMS#CLEANLINESS</tspan><tspan fill="var(--mu)">, </tspan><tspan fill="#3FB950" font-weight="800">POS</tspan><tspan fill="var(--mu)">)</tspan></text><text x="56" y="162" class="tp tu2" style="animation-delay:0.0s"><tspan fill="var(--mu)">→ (</tspan><tspan fill="var(--ac)">breakfast</tspan><tspan fill="var(--mu)">, </tspan><tspan fill="var(--hi)">overpriced</tspan><tspan fill="var(--mu)">, </tspan><tspan fill="var(--ink)">FOOD#PRICES</tspan><tspan fill="var(--mu)">, </tspan><tspan fill="#F85149" font-weight="800">NEG</tspan><tspan fill="var(--mu)">)</tspan></text>
  </g>
  <g class="grp" style="animation-delay:7.0s">
    <text x="806" y="56" text-anchor="end" class="tg">2/3 · vietnamese</text>
    <g class="hl" style="animation-delay:7.0s"><rect x="54.0" y="77" width="180.0" height="26" rx="5" fill="var(--ac)" fill-opacity=".14"/><rect x="56.0" y="102" width="176.0" height="2.5" rx="1.2" fill="var(--ac)"/><text x="56.0" y="70" class="lb" fill="var(--ac)">ASPECT</text></g><g class="hl" style="animation-delay:7.0s"><rect x="241.0" y="77" width="158.0" height="26" rx="5" fill="var(--hi)" fill-opacity=".16" stroke="var(--hi)" stroke-opacity=".5"/><text x="243.0" y="70" class="lb" fill="var(--hi)">OPINION</text></g><g class="hl2" style="animation-delay:7.0s"><rect x="417.0" y="77" width="59.0" height="26" rx="5" fill="var(--ac)" fill-opacity=".14"/><rect x="419.0" y="102" width="55.0" height="2.5" rx="1.2" fill="var(--ac)"/><text x="419.0" y="70" class="lb" fill="var(--ac)">ASPECT</text></g><g class="hl2" style="animation-delay:7.0s"><rect x="527.0" y="77" width="81.0" height="26" rx="5" fill="var(--hi)" fill-opacity=".16" stroke="var(--hi)" stroke-opacity=".5"/><text x="529.0" y="70" class="lb" fill="var(--hi)">OPINION</text></g>
    <text x="56" y="96" class="sn" textLength="561" lengthAdjust="spacingAndGlyphs" clip-path="url(#ty1)">Nhân viên lễ tân rất nhiệt tình, phòng thì hơi nhỏ.</text>
    <rect x="57" y="79" width="2" height="22" fill="var(--ac)" style="animation: car1 21.0s 7.0s infinite both"/>
    <text x="56" y="138" class="tp tu" style="animation-delay:7.0s"><tspan fill="var(--mu)">→ (</tspan><tspan fill="var(--ac)">Nhân viên lễ tân</tspan><tspan fill="var(--mu)">, </tspan><tspan fill="var(--hi)">rất nhiệt tình</tspan><tspan fill="var(--mu)">, </tspan><tspan fill="var(--ink)">SERVICE#GENERAL</tspan><tspan fill="var(--mu)">, </tspan><tspan fill="#3FB950" font-weight="800">POS</tspan><tspan fill="var(--mu)">)</tspan></text><text x="56" y="162" class="tp tu2" style="animation-delay:7.0s"><tspan fill="var(--mu)">→ (</tspan><tspan fill="var(--ac)">phòng</tspan><tspan fill="var(--mu)">, </tspan><tspan fill="var(--hi)">hơi nhỏ</tspan><tspan fill="var(--mu)">, </tspan><tspan fill="var(--ink)">ROOMS#DESIGN</tspan><tspan fill="var(--mu)">, </tspan><tspan fill="#F85149" font-weight="800">NEG</tspan><tspan fill="var(--mu)">)</tspan></text>
  </g>
  <g class="grp" style="animation-delay:14.0s">
    <text x="806" y="56" text-anchor="end" class="tg">3/3 · implicit aspects</text>
    <g class="hl" style="animation-delay:14.0s"><rect x="153.0" y="77" width="191.0" height="26" rx="5" fill="var(--hi)" fill-opacity=".16" stroke="var(--hi)" stroke-opacity=".5"/><text x="155.0" y="70" class="lb" fill="var(--hi)">OPINION</text></g><g class="hl2" style="animation-delay:14.0s"><rect x="362.0" y="77" width="180.0" height="26" rx="5" fill="var(--hi)" fill-opacity=".16" stroke="var(--hi)" stroke-opacity=".5"/><text x="364.0" y="70" class="lb" fill="var(--hi)">OPINION</text></g>
    <text x="56" y="96" class="sn" textLength="495" lengthAdjust="spacingAndGlyphs" clip-path="url(#ty2)">Honestly worth every penny, would stay again.</text>
    <rect x="57" y="79" width="2" height="22" fill="var(--ac)" style="animation: car2 21.0s 14.0s infinite both"/>
    <text x="56" y="138" class="tp tu" style="animation-delay:14.0s"><tspan fill="var(--mu)">→ (</tspan><tspan fill="var(--mu)" font-style="italic">NULL</tspan><tspan fill="var(--mu)">, </tspan><tspan fill="var(--hi)">worth every penny</tspan><tspan fill="var(--mu)">, </tspan><tspan fill="var(--ink)">HOTEL#PRICES</tspan><tspan fill="var(--mu)">, </tspan><tspan fill="#3FB950" font-weight="800">POS</tspan><tspan fill="var(--mu)">)</tspan></text><text x="56" y="162" class="tp tu2" style="animation-delay:14.0s"><tspan fill="var(--mu)">→ (</tspan><tspan fill="var(--mu)" font-style="italic">NULL</tspan><tspan fill="var(--mu)">, </tspan><tspan fill="var(--hi)">would stay again</tspan><tspan fill="var(--mu)">, </tspan><tspan fill="var(--ink)">HOTEL#GENERAL</tspan><tspan fill="var(--mu)">, </tspan><tspan fill="#3FB950" font-weight="800">POS</tspan><tspan fill="var(--mu)">)</tspan></text>
  </g>
    <rect y="176" width="830" height="1" fill="var(--bd)"/>
    <text x="24" y="195" class="ft">aspect sentiment quad prediction · one review in, (aspect, opinion, category, sentiment) out</text>
  </g>
  <rect x=".5" y=".5" width="829" height="205" rx="12" fill="none" stroke="var(--bd)"/>
</svg>
