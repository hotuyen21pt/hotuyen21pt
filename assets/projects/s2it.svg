<svg xmlns="http://www.w3.org/2000/svg" width="400" height="314" viewBox="0 0 400 314" role="img" aria-label="S2IT · Tree-CoT-RT: Two ASQP baselines, rebuilt faithfully">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" style="stop-color:#0EA5E9"/>
      <stop offset="50%" style="stop-color:#0EA5E9;stop-opacity:.2"/>
      <stop offset="100%" style="stop-color:#0EA5E9"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="398" height="312" rx="14"/></clipPath>
  </defs>
  <style>
    svg { --panel:#F6F8FA; --card:#FFFFFF; --ink:#1F2328; --tx:#3D4752; --dim:#6E7781;
          --chip:#F3F6FA; --ac:#0B6FD4 }
    @media (prefers-color-scheme: dark) {
      svg { --panel:#161B26; --card:#111826; --ink:#F0F6FC; --tx:#C3CDD8; --dim:#8B949E;
            --chip:#1A2333; --ac:#36BCF7 }
    }

    .tr { stroke-dasharray: 160; stroke-dashoffset: 160; animation: tr 5s ease-in-out infinite }
    @keyframes tr { 0% { stroke-dashoffset:160 } 35%,90% { stroke-dashoffset:0 } 100% { stroke-dashoffset:160 } }
    .nd { transform-box: fill-box; transform-origin: center; animation: nd 5s ease-in-out infinite both }
    @keyframes nd { 0%,10% { transform: scale(0) } 25%,90% { transform: scale(1) } 100% { transform: scale(0) } }
    .rw { opacity:0; animation: rw 5s ease-in-out infinite }
    @keyframes rw { 0%,45% { opacity:0 } 55%,85% { opacity:1 } 100% { opacity:0 } }
    .vt { font: 600 7.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace }
    .vt:not([fill]) { fill: var(--dim) }
    .pl { transform-box: fill-box; transform-origin: center; animation: pl 2s ease-in-out infinite }
    @keyframes pl { 0%,100% { transform: scale(1) } 50% { transform: scale(1.6) } }
    svg { --line:#D8DEE4 }
    @media (prefers-color-scheme: dark) { svg { --line:#253043 } }
    .card { animation: card .7s 0.40s cubic-bezier(.22,1,.36,1) both }
    @keyframes card { from { opacity:0; transform: translateY(10px) } to { opacity:1; transform:none } }
    .pop { opacity:0; transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.22,1,.36,1) both }
    @keyframes pop { from { opacity:0; transform: scale(.85) } to { opacity:1; transform:none } }
    .sheen { animation: sheen 5s 4.5s ease-in-out infinite }
    @keyframes sheen { 0% { transform: translateX(-140px) } 40%,100% { transform: translateX(560px) } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite }
    @keyframes pulse { 0%,100% { opacity:.35; transform: scale(1) } 50% { opacity:1; transform: scale(1.4) } }
    .nudge { animation: nudge 2.4s ease-in-out infinite }
    @keyframes nudge { 0%,100% { transform: none } 50% { transform: translateX(3px) } }
    @media (prefers-reduced-motion: reduce) {
      .card,.pop,.sheen,.pulse,.nudge { animation: none !important; opacity: 1 } .sheen { display: none }
    }
  </style>
  <g class="card">
    <rect x="1" y="1" width="398" height="312" rx="14" fill="var(--card)" stroke="url(#rim)" stroke-width="2"/>
    <g clip-path="url(#clip)">
      <rect width="400" height="5" fill="#0EA5E9"/>
      <rect width="400" height="88" fill="#0EA5E9" fill-opacity=".06"/>
      <g class="sheen"><rect width="90" height="314" fill="url(#glare)" transform="skewX(-20)"/></g>
    </g>
    <rect x="18" y="20" width="36" height="36" rx="9" fill="#0EA5E9"/>
    <text x="36" y="42.5" text-anchor="middle" style="font:800 13px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="#FFFFFF">S2</text>
    <text x="66" y="30" style="font:700 8.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace;letter-spacing:1.6px" fill="#0EA5E9">PAPER REPRODUCTIONS</text>
    <text x="66" y="50" style="font:700 17px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--ink)">S2IT · Tree-CoT-RT</text>
    <g transform="translate(264,16)">
      <path d="M59,4 L30,24 M59,4 L88,24 M30,24 L16,44 M30,24 L44,44 M88,24 L74,44 M88,24 L102,44"
            fill="none" stroke="#0EA5E9" stroke-width="1.6" class="tr"/>
      <circle cx="59" cy="4" r="3.5" fill="#0EA5E9" class="nd" style="animation-delay:0s"/><circle cx="30" cy="24" r="3.5" fill="#0EA5E9" class="nd" style="animation-delay:0.4s"/><circle cx="88" cy="24" r="3.5" fill="#0EA5E9" class="nd" style="animation-delay:0.4s"/><circle cx="16" cy="44" r="3.5" fill="#0EA5E9" class="nd" style="animation-delay:0.8s"/><circle cx="44" cy="44" r="3.5" fill="#0EA5E9" class="nd" style="animation-delay:0.8s"/><circle cx="74" cy="44" r="3.5" fill="#0EA5E9" class="nd" style="animation-delay:0.8s"/><circle cx="102" cy="44" r="3.5" fill="#0EA5E9" class="nd" style="animation-delay:0.8s"/>
      <circle cx="74" cy="44" r="7" fill="none" stroke="#FACC15" stroke-width="2" class="rw"/>
      <text x="118" y="10" text-anchor="end" class="vt" fill="#FACC15">reward</text></g>
    <text x="18" y="78" style="font:600 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--dim)">Two ASQP baselines, rebuilt faithfully</text>
    <g class="pop" style="animation-delay:0.35s"><rect x="18.0" y="92" width="116.0" height="54" rx="9" fill="#0EA5E9" fill-opacity=".09" stroke="#0EA5E9" stroke-opacity=".35"/><text x="30.0" y="118" style="font:800 18px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="#0EA5E9">NAACL &#x27;25</text><text x="30.0" y="136" style="font:500 9.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--dim)">S2IT</text></g>
    <g class="pop" style="animation-delay:0.45s"><rect x="142.0" y="92" width="116.0" height="54" rx="9" fill="#0EA5E9" fill-opacity=".09" stroke="#0EA5E9" stroke-opacity=".35"/><text x="154.0" y="118" style="font:800 18px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="#0EA5E9">ACL &#x27;26</text><text x="154.0" y="136" style="font:500 9.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--dim)">Tree-CoT-RT</text></g>
    <g class="pop" style="animation-delay:0.55s"><rect x="266.0" y="92" width="116.0" height="54" rx="9" fill="#0EA5E9" fill-opacity=".09" stroke="#0EA5E9" stroke-opacity=".35"/><text x="278.0" y="118" style="font:800 18px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="#0EA5E9">95</text><text x="278.0" y="136" style="font:500 9.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--dim)">tests</text></g>
    <text x="18" y="172" style="font:400 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--tx)">S2IT: three-stage syntax-guided tuning on one LoRA adapter with</text>
    <text x="18" y="188" style="font:400 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--tx)">dependency-graph supervision. Tree-CoT-RT: type-specific</text>
    <text x="18" y="204" style="font:400 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--tx)">reasoning trees, tSFT, then GRPO with a rule-based reward and</text>
    <text x="18" y="220" style="font:400 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--tx)">self-consistent voting.</text>
    <rect x="18.0" y="238" width="43" height="20" rx="10" fill="var(--chip)" stroke="#0EA5E9" stroke-opacity=".5"/><text x="28.0" y="251.5" style="font:500 9.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace" fill="var(--ink)">GRPO</text>
    <rect x="67.0" y="238" width="54" height="20" rx="10" fill="var(--chip)" stroke="#0EA5E9" stroke-opacity=".5"/><text x="77.0" y="251.5" style="font:500 9.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace" fill="var(--ink)">Stanza</text>
    <rect x="127.5" y="238" width="43" height="20" rx="10" fill="var(--chip)" stroke="#0EA5E9" stroke-opacity=".5"/><text x="137.5" y="251.5" style="font:500 9.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace" fill="var(--ink)">LoRA</text>
    <line x1="18" y1="272" x2="382" y2="272" stroke="var(--line)"/>
    <text x="18" y="294" style="font:500 10px 'JetBrains Mono','Cascadia Code',Consolas,monospace" fill="var(--dim)">hotuyen21pt/s2it  ·  /tree</text>
    <g class="nudge"><text x="382" y="294" text-anchor="end" style="font:700 10.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="#0EA5E9">View repo →</text></g>
  </g>
</svg>
