<svg xmlns="http://www.w3.org/2000/svg" width="400" height="314" viewBox="0 0 400 314" role="img" aria-label="EvidenceKD-MedVQA: Evidence-grounded medical VQA with a verifier">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" style="stop-color:#7C4DFF"/>
      <stop offset="50%" style="stop-color:#7C4DFF;stop-opacity:.2"/>
      <stop offset="100%" style="stop-color:#7C4DFF"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="398" height="312" rx="14"/></clipPath>
  </defs>
  <style>
    svg { --panel:#F6F8FA; --card:#FFFFFF; --ink:#1F2328; --tx:#3D4752; --dim:#6E7781;
          --chip:#F3F6FA; --ac:#0B6FD4 }
    @media (prefers-color-scheme: dark) {
      svg { --panel:#161B26; --card:#111826; --ink:#F0F6FC; --tx:#C3CDD8; --dim:#8B949E;
            --chip:#1A2333; --ac:#36BCF7 }
    }

    .fl { stroke-dasharray: 3 5; animation: fl 1s linear infinite }
    @keyframes fl { to { stroke-dashoffset: -8 } }
    .ck { stroke-dasharray: 20; stroke-dashoffset: 20; animation: ck 2.4s ease-out infinite }
    @keyframes ck { 0%,40% { stroke-dashoffset:20 } 60%,90% { stroke-dashoffset:0 } 100% { stroke-dashoffset:20 } }
    .vt { font: 600 7.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace }
    .vt:not([fill]) { fill: var(--dim) }
    .pl { transform-box: fill-box; transform-origin: center; animation: pl 2s ease-in-out infinite }
    @keyframes pl { 0%,100% { transform: scale(1) } 50% { transform: scale(1.6) } }
    svg { --line:#D8DEE4 }
    @media (prefers-color-scheme: dark) { svg { --line:#253043 } }
    .card { animation: card .7s 0.24s cubic-bezier(.22,1,.36,1) both }
    @keyframes card { from { opacity:0; transform: translateY(10px) } to { opacity:1; transform:none } }
    .pop { opacity:0; transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.22,1,.36,1) both }
    @keyframes pop { from { opacity:0; transform: scale(.85) } to { opacity:1; transform:none } }
    .sheen { animation: sheen 5s 3.3s ease-in-out infinite }
    @keyframes sheen { 0% { transform: translateX(-140px) } 40%,100% { transform: translateX(560px) } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite }
    @keyframes pulse { 0%,100% { opacity:.35; transform: scale(1) } 50% { opacity:1; transform: scale(1.4) } }
    .nudge { animation: nudge 2.4s ease-in-out infinite }
    @keyframes nudge { 0%,100% { transform: none } 50% { transform: translateX(3px) } }
    @media (prefers-reduced-motion: reduce) {
      .card,.pop,.sheen,.pulse,.nudge { animation: none !important; opacity: 1 } .sheen { display: none }
    }
  </style>
  <g class="card">
    <rect x="1" y="1" width="398" height="312" rx="14" fill="var(--card)" stroke="url(#rim)" stroke-width="2"/>
    <g clip-path="url(#clip)">
      <rect width="400" height="5" fill="#7C4DFF"/>
      <rect width="400" height="88" fill="#7C4DFF" fill-opacity=".06"/>
      <g class="sheen"><rect width="90" height="314" fill="url(#glare)" transform="skewX(-20)"/></g>
    </g>
    <rect x="18" y="20" width="36" height="36" rx="9" fill="#7C4DFF"/>
    <text x="36" y="42.5" text-anchor="middle" style="font:800 13px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="#FFFFFF">EK</text>
    <text x="66" y="30" style="font:700 8.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace;letter-spacing:1.6px" fill="#7C4DFF">RESEARCH</text>
    <text x="66" y="50" style="font:700 17px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--ink)">EvidenceKD-MedVQA</text>
    <g transform="translate(264,16)">
      <line x1="18" y1="22" x2="51" y2="22" stroke="#7C4DFF" stroke-width="2" class="fl"/>
      <line x1="67" y1="22" x2="100" y2="22" stroke="#7C4DFF" stroke-width="2" class="fl"/>
      <circle cx="9" cy="22" r="9" fill="#7C4DFF" fill-opacity=".15" stroke="#7C4DFF"/><text x="9" y="25.5" text-anchor="middle" class="vt" fill="#7C4DFF" font-weight="800">D</text><text x="9" y="44" text-anchor="middle" class="vt">decide</text><circle cx="59" cy="22" r="9" fill="#7C4DFF" fill-opacity=".15" stroke="#7C4DFF"/><text x="59" y="25.5" text-anchor="middle" class="vt" fill="#7C4DFF" font-weight="800">E</text><text x="59" y="44" text-anchor="middle" class="vt">explain</text><circle cx="109" cy="22" r="9" fill="#7C4DFF" fill-opacity=".15" stroke="#7C4DFF"/><text x="109" y="25.5" text-anchor="middle" class="vt" fill="#7C4DFF" font-weight="800">V</text><text x="109" y="44" text-anchor="middle" class="vt">verify</text>
      <path d="M103,3 L107,7 L115,-1" fill="none" stroke="#3FB950" stroke-width="2.4" stroke-linecap="round" class="ck"/></g>
    <text x="18" y="78" style="font:600 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--dim)">Evidence-grounded medical VQA with a verifier</text>
    <g class="pop" style="animation-delay:0.35s"><rect x="18.0" y="92" width="116.0" height="54" rx="9" fill="#7C4DFF" fill-opacity=".09" stroke="#7C4DFF" stroke-opacity=".35"/><text x="30.0" y="118" style="font:800 18px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="#7C4DFF">180</text><text x="30.0" y="136" style="font:500 9.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--dim)">tests passing</text></g>
    <g class="pop" style="animation-delay:0.45s"><rect x="142.0" y="92" width="116.0" height="54" rx="9" fill="#7C4DFF" fill-opacity=".09" stroke="#7C4DFF" stroke-opacity=".35"/><text x="154.0" y="118" style="font:800 18px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="#7C4DFF">3-stage</text><text x="154.0" y="136" style="font:500 9.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--dim)">decide, explain, verify</text></g>
    <g class="pop" style="animation-delay:0.55s"><rect x="266.0" y="92" width="116.0" height="54" rx="9" fill="#7C4DFF" fill-opacity=".09" stroke="#7C4DFF" stroke-opacity=".35"/><text x="278.0" y="118" style="font:800 18px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="#7C4DFF">torch-free</text><text x="278.0" y="136" style="font:500 9.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--dim)">core logic</text></g>
    <text x="18" y="172" style="font:400 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--tx)">A decision branch produces the answer, findings and scores; a</text>
    <text x="18" y="188" style="font:400 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--tx)">generator only explains them under a citation constraint; a</text>
    <text x="18" y="204" style="font:400 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--tx)">verifier checks every claim. Faster R-CNN evidence detector with</text>
    <text x="18" y="220" style="font:400 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--tx)">knowledge distillation.</text>
    <rect x="18.0" y="238" width="89" height="20" rx="10" fill="var(--chip)" stroke="#7C4DFF" stroke-opacity=".5"/><text x="28.0" y="251.5" style="font:500 9.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace" fill="var(--ink)">Faster R-CNN</text>
    <rect x="113.0" y="238" width="89" height="20" rx="10" fill="var(--chip)" stroke="#7C4DFF" stroke-opacity=".5"/><text x="123.0" y="251.5" style="font:500 9.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace" fill="var(--ink)">Distillation</text>
    <rect x="208.0" y="238" width="54" height="20" rx="10" fill="var(--chip)" stroke="#7C4DFF" stroke-opacity=".5"/><text x="218.0" y="251.5" style="font:500 9.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace" fill="var(--ink)">pytest</text>
    <line x1="18" y1="272" x2="382" y2="272" stroke="var(--line)"/>
    <text x="18" y="294" style="font:500 10px 'JetBrains Mono','Cascadia Code',Consolas,monospace" fill="var(--dim)">hotuyen21pt/EvidenceKD-MedVQA</text>
    <g class="nudge"><text x="382" y="294" text-anchor="end" style="font:700 10.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="#7C4DFF">View repo →</text></g>
  </g>
</svg>
