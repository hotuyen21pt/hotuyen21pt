<svg xmlns="http://www.w3.org/2000/svg" width="400" height="314" viewBox="0 0 400 314" role="img" aria-label="Detect-CCCD: Vietnamese ID card classifier as an OCR REST API">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" style="stop-color:#14B8A6"/>
      <stop offset="50%" style="stop-color:#14B8A6;stop-opacity:.2"/>
      <stop offset="100%" style="stop-color:#14B8A6"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="398" height="312" rx="14"/></clipPath>
  </defs>
  <style>
    svg { --panel:#F6F8FA; --card:#FFFFFF; --ink:#1F2328; --tx:#3D4752; --dim:#6E7781;
          --chip:#F3F6FA; --ac:#0B6FD4 }
    @media (prefers-color-scheme: dark) {
      svg { --panel:#161B26; --card:#111826; --ink:#F0F6FC; --tx:#C3CDD8; --dim:#8B949E;
            --chip:#1A2333; --ac:#36BCF7 }
    }

    .sc { animation: sc 3.6s ease-in-out infinite }
    @keyframes sc { 0% { transform: translateY(0); opacity:.2 } 45% { transform: translateY(44px); opacity:.9 } 50%,100% { opacity:0; transform: translateY(44px) } }
    .ox { transform-box: fill-box; transform-origin: left center; animation: ox 3.6s ease-out infinite both }
    @keyframes ox { 0%,5% { transform: scaleX(0) } 30%,90% { transform: scaleX(1) } 100% { transform: scaleX(0) } }
    .cl { opacity:0; animation: cl 3.6s ease-out infinite }
    @keyframes cl { 0%,50% { opacity:0 } 60%,90% { opacity:1 } 100% { opacity:0 } }
    .vt { font: 600 7.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace }
    .vt:not([fill]) { fill: var(--dim) }
    .pl { transform-box: fill-box; transform-origin: center; animation: pl 2s ease-in-out infinite }
    @keyframes pl { 0%,100% { transform: scale(1) } 50% { transform: scale(1.6) } }
    svg { --line:#D8DEE4 }
    @media (prefers-color-scheme: dark) { svg { --line:#253043 } }
    .card { animation: card .7s 0.56s cubic-bezier(.22,1,.36,1) both }
    @keyframes card { from { opacity:0; transform: translateY(10px) } to { opacity:1; transform:none } }
    .pop { opacity:0; transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.22,1,.36,1) both }
    @keyframes pop { from { opacity:0; transform: scale(.85) } to { opacity:1; transform:none } }
    .sheen { animation: sheen 5s 5.7s ease-in-out infinite }
    @keyframes sheen { 0% { transform: translateX(-140px) } 40%,100% { transform: translateX(560px) } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite }
    @keyframes pulse { 0%,100% { opacity:.35; transform: scale(1) } 50% { opacity:1; transform: scale(1.4) } }
    .nudge { animation: nudge 2.4s ease-in-out infinite }
    @keyframes nudge { 0%,100% { transform: none } 50% { transform: translateX(3px) } }
    @media (prefers-reduced-motion: reduce) {
      .card,.pop,.sheen,.pulse,.nudge { animation: none !important; opacity: 1 } .sheen { display: none }
    }
  </style>
  <g class="card">
    <rect x="1" y="1" width="398" height="312" rx="14" fill="var(--card)" stroke="url(#rim)" stroke-width="2"/>
    <g clip-path="url(#clip)">
      <rect width="400" height="5" fill="#14B8A6"/>
      <rect width="400" height="88" fill="#14B8A6" fill-opacity=".06"/>
      <g class="sheen"><rect width="90" height="314" fill="url(#glare)" transform="skewX(-20)"/></g>
    </g>
    <rect x="18" y="20" width="36" height="36" rx="9" fill="#14B8A6"/>
    <text x="36" y="42.5" text-anchor="middle" style="font:800 13px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="#FFFFFF">ID</text>
    <text x="66" y="30" style="font:700 8.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace;letter-spacing:1.6px" fill="#14B8A6">PRODUCT</text>
    <text x="66" y="50" style="font:700 17px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--ink)">Detect-CCCD</text>
    <g transform="translate(264,16)">
      <rect x="4" y="1" width="110" height="46" rx="5" fill="#14B8A6" fill-opacity=".07" stroke="#14B8A6" stroke-opacity=".5"/>
      <rect x="11" y="9" width="22" height="28" rx="3" fill="#14B8A6" fill-opacity=".2"/>
      <circle cx="22" cy="19" r="5" fill="#14B8A6" fill-opacity=".6"/>
      <path d="M14,35 Q22,25 30,35" fill="#14B8A6" fill-opacity=".6"/>
      <rect x="40" y="10" width="50" height="4" rx="2" fill="var(--ink)" fill-opacity=".55" class="ox" style="animation-delay:0s"/><rect x="40" y="19" width="64" height="4" rx="2" fill="var(--ink)" fill-opacity=".55" class="ox" style="animation-delay:0.3s"/><rect x="40" y="28" width="40" height="4" rx="2" fill="var(--ink)" fill-opacity=".55" class="ox" style="animation-delay:0.6s"/><rect x="40" y="37" width="56" height="4" rx="2" fill="var(--ink)" fill-opacity=".55" class="ox" style="animation-delay:0.9s"/>
      <rect x="4" y="1" width="110" height="2" fill="#14B8A6" class="sc"/>
      <text x="114" y="-3" text-anchor="end" class="vt cl" fill="#3FB950">CCCD ✓</text></g>
    <text x="18" y="78" style="font:600 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--dim)">Vietnamese ID card classifier as an OCR REST API</text>
    <g class="pop" style="animation-delay:0.35s"><rect x="18.0" y="92" width="116.0" height="54" rx="9" fill="#14B8A6" fill-opacity=".09" stroke="#14B8A6" stroke-opacity=".35"/><text x="30.0" y="118" style="font:800 18px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="#14B8A6">2</text><text x="30.0" y="136" style="font:500 9.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--dim)">card types</text></g>
    <g class="pop" style="animation-delay:0.45s"><rect x="142.0" y="92" width="116.0" height="54" rx="9" fill="#14B8A6" fill-opacity=".09" stroke="#14B8A6" stroke-opacity=".35"/><text x="154.0" y="118" style="font:800 18px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="#14B8A6">OCR</text><text x="154.0" y="136" style="font:500 9.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--dim)">Vietnamese model</text></g>
    <g class="pop" style="animation-delay:0.55s"><rect x="266.0" y="92" width="116.0" height="54" rx="9" fill="#14B8A6" fill-opacity=".09" stroke="#14B8A6" stroke-opacity=".35"/><text x="278.0" y="118" style="font:800 18px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="#14B8A6">CI</text><text x="278.0" y="136" style="font:500 9.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--dim)">GitHub Actions</text></g>
    <text x="18" y="172" style="font:400 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--tx)">Classifies an image as a citizen ID (CCCD) or a student card by</text>
    <text x="18" y="188" style="font:400 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--tx)">running Vietnamese PaddleOCR and scoring keyword matches.</text>
    <text x="18" y="204" style="font:400 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--tx)">FastAPI endpoint, drag-and-drop web UI, Dockerised.</text>
    <rect x="18.0" y="238" width="72" height="20" rx="10" fill="var(--chip)" stroke="#14B8A6" stroke-opacity=".5"/><text x="28.0" y="251.5" style="font:500 9.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace" fill="var(--ink)">PaddleOCR</text>
    <rect x="95.8" y="238" width="60" height="20" rx="10" fill="var(--chip)" stroke="#14B8A6" stroke-opacity=".5"/><text x="105.8" y="251.5" style="font:500 9.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace" fill="var(--ink)">FastAPI</text>
    <rect x="162.0" y="238" width="54" height="20" rx="10" fill="var(--chip)" stroke="#14B8A6" stroke-opacity=".5"/><text x="172.0" y="251.5" style="font:500 9.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace" fill="var(--ink)">Docker</text>
    <line x1="18" y1="272" x2="382" y2="272" stroke="var(--line)"/>
    <text x="18" y="294" style="font:500 10px 'JetBrains Mono','Cascadia Code',Consolas,monospace" fill="var(--dim)">hotuyen21pt/Detect-CCCD</text>
    <g class="nudge"><text x="382" y="294" text-anchor="end" style="font:700 10.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="#14B8A6">View repo →</text></g>
  </g>
</svg>
