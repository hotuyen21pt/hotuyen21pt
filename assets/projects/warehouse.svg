<svg xmlns="http://www.w3.org/2000/svg" width="400" height="314" viewBox="0 0 400 314" role="img" aria-label="Smart Warehouse: IoT lot tracking for multi-branch warehouses">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" style="stop-color:#84CC16"/>
      <stop offset="50%" style="stop-color:#84CC16;stop-opacity:.2"/>
      <stop offset="100%" style="stop-color:#84CC16"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="398" height="312" rx="14"/></clipPath>
  </defs>
  <style>
    svg { --panel:#F6F8FA; --card:#FFFFFF; --ink:#1F2328; --tx:#3D4752; --dim:#6E7781;
          --chip:#F3F6FA; --ac:#0B6FD4 }
    @media (prefers-color-scheme: dark) {
      svg { --panel:#161B26; --card:#111826; --ink:#F0F6FC; --tx:#C3CDD8; --dim:#8B949E;
            --chip:#1A2333; --ac:#36BCF7 }
    }

    svg { --line:#D8DEE4 }
    @media (prefers-color-scheme: dark) { svg { --line:#253043 } }
    .card { animation: card .7s 0.48s cubic-bezier(.22,1,.36,1) both }
    @keyframes card { from { opacity:0; transform: translateY(10px) } to { opacity:1; transform:none } }
    .pop { opacity:0; transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.22,1,.36,1) both }
    @keyframes pop { from { opacity:0; transform: scale(.85) } to { opacity:1; transform:none } }
    .sheen { animation: sheen 5s 5.1s ease-in-out infinite }
    @keyframes sheen { 0% { transform: translateX(-140px) } 40%,100% { transform: translateX(560px) } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite }
    @keyframes pulse { 0%,100% { opacity:.35; transform: scale(1) } 50% { opacity:1; transform: scale(1.4) } }
    .nudge { animation: nudge 2.4s ease-in-out infinite }
    @keyframes nudge { 0%,100% { transform: none } 50% { transform: translateX(3px) } }
    @media (prefers-reduced-motion: reduce) {
      .card,.pop,.sheen,.pulse,.nudge { animation: none !important; opacity: 1 } .sheen { display: none }
    }
  </style>
  <g class="card">
    <rect x="1" y="1" width="398" height="312" rx="14" fill="var(--card)" stroke="url(#rim)" stroke-width="2"/>
    <g clip-path="url(#clip)">
      <rect width="400" height="5" fill="#84CC16"/>
      <rect width="400" height="88" fill="#84CC16" fill-opacity=".06"/>
      <g class="sheen"><rect width="90" height="314" fill="url(#glare)" transform="skewX(-20)"/></g>
    </g>
    <rect x="18" y="20" width="36" height="36" rx="9" fill="#84CC16"/>
    <text x="36" y="42.5" text-anchor="middle" style="font:800 13px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="#FFFFFF">SW</text>
    <text x="66" y="30" style="font:700 8.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace;letter-spacing:1.6px" fill="#84CC16">PRODUCT</text>
    <text x="66" y="50" style="font:700 17px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--ink)">Smart Warehouse</text>
    <circle class="pulse" cx="378" cy="26" r="3.5" fill="#84CC16"/>
    <text x="18" y="78" style="font:600 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--dim)">IoT lot tracking for multi-branch warehouses</text>
    <g class="pop" style="animation-delay:0.35s"><rect x="18.0" y="92" width="116.0" height="54" rx="9" fill="#84CC16" fill-opacity=".09" stroke="#84CC16" stroke-opacity=".35"/><text x="30.0" y="118" style="font:800 18px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="#84CC16">Go + Gin</text><text x="30.0" y="136" style="font:500 9.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--dim)">JWT REST API</text></g>
    <g class="pop" style="animation-delay:0.45s"><rect x="142.0" y="92" width="116.0" height="54" rx="9" fill="#84CC16" fill-opacity=".09" stroke="#84CC16" stroke-opacity=".35"/><text x="154.0" y="118" style="font:800 18px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="#84CC16">React 18</text><text x="154.0" y="136" style="font:500 9.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--dim)">TypeScript + Vite</text></g>
    <g class="pop" style="animation-delay:0.55s"><rect x="266.0" y="92" width="116.0" height="54" rx="9" fill="#84CC16" fill-opacity=".09" stroke="#84CC16" stroke-opacity=".35"/><text x="278.0" y="118" style="font:800 18px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="#84CC16">CV</text><text x="278.0" y="136" style="font:500 9.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--dim)">box-counter service</text></g>
    <text x="18" y="172" style="font:400 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--tx)">Barcode and QR scanning track lot numbers, manufacturing and</text>
    <text x="18" y="188" style="font:400 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--tx)">expiry dates per SKU and branch, with a computer-vision service</text>
    <text x="18" y="204" style="font:400 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="var(--tx)">that counts boxes. Docker Compose for the whole stack.</text>
    <rect x="18.0" y="238" width="32" height="20" rx="10" fill="var(--chip)" stroke="#84CC16" stroke-opacity=".5"/><text x="28.0" y="251.5" style="font:500 9.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace" fill="var(--ink)">Go</text>
    <rect x="55.5" y="238" width="37" height="20" rx="10" fill="var(--chip)" stroke="#84CC16" stroke-opacity=".5"/><text x="65.5" y="251.5" style="font:500 9.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace" fill="var(--ink)">Gin</text>
    <rect x="98.8" y="238" width="49" height="20" rx="10" fill="var(--chip)" stroke="#84CC16" stroke-opacity=".5"/><text x="108.8" y="251.5" style="font:500 9.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace" fill="var(--ink)">React</text>
    <rect x="153.5" y="238" width="78" height="20" rx="10" fill="var(--chip)" stroke="#84CC16" stroke-opacity=".5"/><text x="163.5" y="251.5" style="font:500 9.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace" fill="var(--ink)">TypeScript</text>
    <rect x="237.0" y="238" width="54" height="20" rx="10" fill="var(--chip)" stroke="#84CC16" stroke-opacity=".5"/><text x="247.0" y="251.5" style="font:500 9.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace" fill="var(--ink)">Docker</text>
    <line x1="18" y1="272" x2="382" y2="272" stroke="var(--line)"/>
    <text x="18" y="294" style="font:500 10px 'JetBrains Mono','Cascadia Code',Consolas,monospace" fill="var(--dim)">hotuyen21pt/Smart-Warehouse-Management</text>
    <g class="nudge"><text x="382" y="294" text-anchor="end" style="font:700 10.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif" fill="#84CC16">View repo →</text></g>
  </g>
</svg>
