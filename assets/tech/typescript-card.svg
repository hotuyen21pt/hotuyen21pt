<svg xmlns="http://www.w3.org/2000/svg" width="240" height="167" viewBox="0 0 240 167" role="img" aria-label="TypeScript: Typed React 18 frontend for the warehouse system.">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" style="stop-color:#3178C6"/>
      <stop offset="50%" style="stop-color:var(--ac)"/>
      <stop offset="100%" style="stop-color:#3178C6"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="238" height="165" rx="12"/></clipPath>
  </defs>
  <style>
    svg { --card:#FFFFFF; --ink:#1F2328; --tx:#3D4752; --dim:#6E7781; --chip:#F3F6FA; --ac:#0B6FD4 }
    @media (prefers-color-scheme: dark) {
      svg { --card:#111826; --ink:#F0F6FC; --tx:#C3CDD8; --dim:#8B949E; --chip:#1A2333; --ac:#36BCF7 }
    }
    .t  { font: 700 15px 'Segoe UI',Ubuntu,-apple-system,sans-serif; fill: var(--ink) }
    .d  { font: 400 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif; fill: var(--tx) }
    .k  { font: 700 8.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace; letter-spacing: 1.4px }
    .c  { font: 500 9.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace; fill: var(--ink) }
    .mn { font: 800 10px 'Segoe UI',Ubuntu,-apple-system,sans-serif }

    /* Entrance: the card settles, the rule draws, lines and chips follow. */
    .card { animation: card .55s cubic-bezier(.2,.8,.2,1) both }
    @keyframes card { from { opacity:0; transform: translateY(-8px) scale(.97) } to { opacity:1; transform:none } }
    .in   { opacity:0; animation: in .45s cubic-bezier(.2,.8,.2,1) both }
    @keyframes in { from { opacity:0; transform: translateX(-6px) } to { opacity:1; transform:none } }
    .pop  { opacity:0; transform-box: fill-box; transform-origin: center;
            animation: pop .4s cubic-bezier(.34,1.56,.64,1) both }
    @keyframes pop { from { opacity:0; transform: scale(.6) } to { opacity:1; transform:none } }
    .rule { stroke-dasharray: 212; stroke-dashoffset: 212; animation: draw .7s .25s cubic-bezier(.3,.7,.4,1) forwards }
    @keyframes draw { to { stroke-dashoffset: 0 } }

    /* Ambient, so the card still feels alive after the entrance has played. */
    .sheen { animation: sheen 3.6s 1s ease-in-out infinite }
    @keyframes sheen { 0% { transform: translateX(-120px) } 55%,100% { transform: translateX(380px) } }
    .blink { animation: blink 1.1s steps(1) infinite }
    @keyframes blink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-in-out infinite }
    @keyframes pulse { 0%,100% { opacity:.35; transform: scale(1) } 50% { opacity:1; transform: scale(1.35) } }

    @media (prefers-reduced-motion: reduce) {
      .card,.in,.pop,.rule,.sheen,.blink,.pulse { animation: none !important; opacity: 1 }
      .rule { stroke-dashoffset: 0 } .sheen { display: none }
    }
  </style>
  <g class="card">
    <rect x="1" y="1" width="238" height="165" rx="12" fill="var(--card)" stroke="url(#rim)" stroke-width="2"/>
    <g clip-path="url(#clip)">
      <rect x="0" y="0" width="240" height="4" fill="#3178C6"/>
      <rect x="0" y="0" width="240" height="64" fill="#3178C6" fill-opacity=".06"/>
      <g class="sheen"><rect x="0" y="0" width="70" height="167" fill="url(#glare)" transform="skewX(-20)"/></g>
    </g>
    <rect x="14" y="16" width="30" height="30" rx="7" fill="#3178C6"/>
    <path transform="translate(20 22) scale(0.7500)" fill="#FFFFFF" d="M1.125 0C.502 0 0 .502 0 1.125v21.75C0 23.498.502 24 1.125 24h21.75c.623 0 1.125-.502 1.125-1.125V1.125C24 .502 23.498 0 22.875 0zm17.363 9.75c.612 0 1.154.037 1.627.111a6.38 6.38 0 0 1 1.306.34v2.458a3.95 3.95 0 0 0-.643-.361 5.093 5.093 0 0 0-.717-.26 5.453 5.453 0 0 0-1.426-.2c-.3 0-.573.028-.819.086a2.1 2.1 0 0 0-.623.242c-.17.104-.3.229-.393.374a.888.888 0 0 0-.14.49c0 .196.053.373.156.529.104.156.252.304.443.444s.423.276.696.41c.273.135.582.274.926.416.47.197.892.407 1.266.628.374.222.695.473.963.753.268.279.472.598.614.957.142.359.214.776.214 1.253 0 .657-.125 1.21-.373 1.656a3.033 3.033 0 0 1-1.012 1.085 4.38 4.38 0 0 1-1.487.596c-.566.12-1.163.18-1.79.18a9.916 9.916 0 0 1-1.84-.164 5.544 5.544 0 0 1-1.512-.493v-2.63a5.033 5.033 0 0 0 3.237 1.2c.333 0 .624-.03.872-.09.249-.06.456-.144.623-.25.166-.108.29-.234.373-.38a1.023 1.023 0 0 0-.074-1.089 2.12 2.12 0 0 0-.537-.5 5.597 5.597 0 0 0-.807-.444 27.72 27.72 0 0 0-1.007-.436c-.918-.383-1.602-.852-2.053-1.405-.45-.553-.676-1.222-.676-2.005 0-.614.123-1.141.369-1.582.246-.441.58-.804 1.004-1.089a4.494 4.494 0 0 1 1.47-.629 7.536 7.536 0 0 1 1.77-.201zm-15.113.188h9.563v2.166H9.506v9.646H6.789v-9.646H3.375z"/>
    <text x="54" y="29" class="t">TypeScript</text>
    <rect x="54" y="35" width="67" height="13" rx="6.5" fill="#3178C6" fill-opacity=".14"/>
    <text x="61" y="44.5" class="k" fill="#3178C6">LANGUAGE</text>
    <circle class="pulse" cx="222" cy="22" r="3" fill="#3178C6"/>
    <line class="rule" x1="14" y1="60" x2="226" y2="60" stroke="url(#rim)" stroke-width="1.5" stroke-linecap="round"/>
    <text x="14" y="80" class="d in" style="animation-delay:0.35s">Typed React 18 frontend for the</text>
    <text x="14" y="96" class="d in" style="animation-delay:0.42s">warehouse system.</text>
    <rect class="blink" x="111" y="87" width="6" height="11" rx="1" fill="#3178C6" opacity=".8"/>
    <text x="14" y="122" class="k in" fill="var(--dim)" style="animation-delay:0.49s">USED IN</text>
    <g class="pop" style="animation-delay:0.57s"><rect x="14" y="131" width="174" height="20" rx="10" fill="var(--chip)" stroke="#3178C6" stroke-opacity=".55"/><circle cx="24" cy="141" r="2.6" fill="#3178C6"/><text x="31" y="144.5" class="c">Smart-Warehouse-Management</text></g>
  </g>
</svg>
