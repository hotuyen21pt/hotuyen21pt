<svg xmlns="http://www.w3.org/2000/svg" width="240" height="193" viewBox="0 0 240 193" role="img" aria-label="OpenCV: Image preprocessing and the computer-vision box counter.">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" style="stop-color:#5C3EE8"/>
      <stop offset="50%" style="stop-color:var(--ac)"/>
      <stop offset="100%" style="stop-color:#5C3EE8"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="238" height="191" rx="12"/></clipPath>
  </defs>
  <style>
    svg { --card:#FFFFFF; --ink:#1F2328; --tx:#3D4752; --dim:#6E7781; --chip:#F3F6FA; --ac:#0B6FD4 }
    @media (prefers-color-scheme: dark) {
      svg { --card:#111826; --ink:#F0F6FC; --tx:#C3CDD8; --dim:#8B949E; --chip:#1A2333; --ac:#36BCF7 }
    }
    .t  { font: 700 15px 'Segoe UI',Ubuntu,-apple-system,sans-serif; fill: var(--ink) }
    .d  { font: 400 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif; fill: var(--tx) }
    .k  { font: 700 8.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace; letter-spacing: 1.4px }
    .c  { font: 500 9.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace; fill: var(--ink) }
    .mn { font: 800 10px 'Segoe UI',Ubuntu,-apple-system,sans-serif }

    /* Entrance: the card settles, the rule draws, lines and chips follow. */
    .card { animation: card .55s cubic-bezier(.2,.8,.2,1) both }
    @keyframes card { from { opacity:0; transform: translateY(-8px) scale(.97) } to { opacity:1; transform:none } }
    .in   { opacity:0; animation: in .45s cubic-bezier(.2,.8,.2,1) both }
    @keyframes in { from { opacity:0; transform: translateX(-6px) } to { opacity:1; transform:none } }
    .pop  { opacity:0; transform-box: fill-box; transform-origin: center;
            animation: pop .4s cubic-bezier(.34,1.56,.64,1) both }
    @keyframes pop { from { opacity:0; transform: scale(.6) } to { opacity:1; transform:none } }
    .rule { stroke-dasharray: 212; stroke-dashoffset: 212; animation: draw .7s .25s cubic-bezier(.3,.7,.4,1) forwards }
    @keyframes draw { to { stroke-dashoffset: 0 } }

    /* Ambient, so the card still feels alive after the entrance has played. */
    .sheen { animation: sheen 3.6s 1s ease-in-out infinite }
    @keyframes sheen { 0% { transform: translateX(-120px) } 55%,100% { transform: translateX(380px) } }
    .blink { animation: blink 1.1s steps(1) infinite }
    @keyframes blink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-in-out infinite }
    @keyframes pulse { 0%,100% { opacity:.35; transform: scale(1) } 50% { opacity:1; transform: scale(1.35) } }

    @media (prefers-reduced-motion: reduce) {
      .card,.in,.pop,.rule,.sheen,.blink,.pulse { animation: none !important; opacity: 1 }
      .rule { stroke-dashoffset: 0 } .sheen { display: none }
    }
  </style>
  <g class="card">
    <rect x="1" y="1" width="238" height="191" rx="12" fill="var(--card)" stroke="url(#rim)" stroke-width="2"/>
    <g clip-path="url(#clip)">
      <rect x="0" y="0" width="240" height="4" fill="#5C3EE8"/>
      <rect x="0" y="0" width="240" height="64" fill="#5C3EE8" fill-opacity=".06"/>
      <g class="sheen"><rect x="0" y="0" width="70" height="193" fill="url(#glare)" transform="skewX(-20)"/></g>
    </g>
    <rect x="14" y="16" width="30" height="30" rx="7" fill="#5C3EE8"/>
    <path transform="translate(20 22) scale(0.7500)" fill="#FFFFFF" d="M11.8992.8525C8.735.8525 6.17 3.4175 6.17 6.5817c0 2.102 1.1321 3.9398 2.8198 4.9366l1.6412-2.7849c.0411-.0699.0176-.1593-.0495-.2048-.6233-.4227-1.0328-1.137-1.0328-1.947 0-1.298 1.0524-2.3504 2.3505-2.3504 1.2981 0 2.3505 1.0524 2.3505 2.3505 0 .8098-.4095 1.5242-1.0328 1.947-.0671.0454-.0907.1348-.0495.2047l1.6414 2.785c1.6878-.9969 2.8199-2.8346 2.8199-4.9367 0-3.1642-2.5653-5.7292-5.7295-5.7292zm-6.17 10.8366C2.565 11.6891 0 14.2541 0 17.4183c0 3.1642 2.565 5.7292 5.7292 5.7292 3.1798 0 5.8074-2.6995 5.7275-5.8762H8.2313c-.0847 0-.1513.0717-.1519.1564-.0082 1.266-1.0644 2.3411-2.3502 2.3411-1.2981 0-2.3505-1.0524-2.3505-2.3505 0-1.2982 1.0524-2.3505 2.3505-2.3505.34 0 .663.0724.9547.2022.0713.0318.1566.0077.1962-.0595l1.6464-2.7935c-.8273-.4636-1.7815-.7279-2.7973-.7279zm15.4424.7614l-1.6366 2.7878c-.041.07-.0172.1594.05.2048.624.4217 1.0348 1.1354 1.0363 1.9452.0022 1.298-1.0483 2.352-2.3465 2.3542-1.298.0023-2.3523-1.0482-2.3545-2.3462-.0015-.8098.4068-1.5248 1.0294-1.9486.067-.0457.0905-.1353.0492-.2051l-1.6464-2.7818c-1.6859.9998-2.8146 2.8394-2.811 4.9415.0056 3.1641 2.575 5.7248 5.7393 5.7192 3.1641-.0054 5.7246-2.575 5.7192-5.7392-.0037-2.1022-1.139-3.938-2.8284-4.9318z"/>
    <text x="54" y="29" class="t">OpenCV</text>
    <rect x="54" y="35" width="60" height="13" rx="6.5" fill="#5C3EE8" fill-opacity=".14"/>
    <text x="61" y="44.5" class="k" fill="#5C3EE8">ML / DL</text>
    <circle class="pulse" cx="222" cy="22" r="3" fill="#5C3EE8"/>
    <line class="rule" x1="14" y1="60" x2="226" y2="60" stroke="url(#rim)" stroke-width="1.5" stroke-linecap="round"/>
    <text x="14" y="80" class="d in" style="animation-delay:0.35s">Image preprocessing and the computer-</text>
    <text x="14" y="96" class="d in" style="animation-delay:0.42s">vision box counter.</text>
    <rect class="blink" x="122" y="87" width="6" height="11" rx="1" fill="#5C3EE8" opacity=".8"/>
    <text x="14" y="122" class="k in" fill="var(--dim)" style="animation-delay:0.49s">USED IN</text>
    <g class="pop" style="animation-delay:0.57s"><rect x="14" y="131" width="174" height="20" rx="10" fill="var(--chip)" stroke="#5C3EE8" stroke-opacity=".55"/><circle cx="24" cy="141" r="2.6" fill="#5C3EE8"/><text x="31" y="144.5" class="c">Smart-Warehouse-Management</text></g>
    <g class="pop" style="animation-delay:0.65s"><rect x="14" y="157" width="87" height="20" rx="10" fill="var(--chip)" stroke="#5C3EE8" stroke-opacity=".55"/><circle cx="24" cy="167" r="2.6" fill="#5C3EE8"/><text x="31" y="170.5" class="c">Detect-CCCD</text></g>
  </g>
</svg>
