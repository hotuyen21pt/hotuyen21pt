<svg xmlns="http://www.w3.org/2000/svg" width="240" height="193" viewBox="0 0 240 193" role="img" aria-label="JavaScript: Demo UIs that put research models in front of people.">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" style="stop-color:#F7DF1E"/>
      <stop offset="50%" style="stop-color:var(--ac)"/>
      <stop offset="100%" style="stop-color:#F7DF1E"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="238" height="191" rx="12"/></clipPath>
  </defs>
  <style>
    svg { --card:#FFFFFF; --ink:#1F2328; --tx:#3D4752; --dim:#6E7781; --chip:#F3F6FA; --ac:#0B6FD4 }
    @media (prefers-color-scheme: dark) {
      svg { --card:#111826; --ink:#F0F6FC; --tx:#C3CDD8; --dim:#8B949E; --chip:#1A2333; --ac:#36BCF7 }
    }
    .t  { font: 700 15px 'Segoe UI',Ubuntu,-apple-system,sans-serif; fill: var(--ink) }
    .d  { font: 400 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif; fill: var(--tx) }
    .k  { font: 700 8.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace; letter-spacing: 1.4px }
    .c  { font: 500 9.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace; fill: var(--ink) }
    .mn { font: 800 10px 'Segoe UI',Ubuntu,-apple-system,sans-serif }

    /* Entrance: the card settles, the rule draws, lines and chips follow. */
    .card { animation: card .55s cubic-bezier(.2,.8,.2,1) both }
    @keyframes card { from { opacity:0; transform: translateY(-8px) scale(.97) } to { opacity:1; transform:none } }
    .in   { opacity:0; animation: in .45s cubic-bezier(.2,.8,.2,1) both }
    @keyframes in { from { opacity:0; transform: translateX(-6px) } to { opacity:1; transform:none } }
    .pop  { opacity:0; transform-box: fill-box; transform-origin: center;
            animation: pop .4s cubic-bezier(.34,1.56,.64,1) both }
    @keyframes pop { from { opacity:0; transform: scale(.6) } to { opacity:1; transform:none } }
    .rule { stroke-dasharray: 212; stroke-dashoffset: 212; animation: draw .7s .25s cubic-bezier(.3,.7,.4,1) forwards }
    @keyframes draw { to { stroke-dashoffset: 0 } }

    /* Ambient, so the card still feels alive after the entrance has played. */
    .sheen { animation: sheen 3.6s 1s ease-in-out infinite }
    @keyframes sheen { 0% { transform: translateX(-120px) } 55%,100% { transform: translateX(380px) } }
    .blink { animation: blink 1.1s steps(1) infinite }
    @keyframes blink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-in-out infinite }
    @keyframes pulse { 0%,100% { opacity:.35; transform: scale(1) } 50% { opacity:1; transform: scale(1.35) } }

    @media (prefers-reduced-motion: reduce) {
      .card,.in,.pop,.rule,.sheen,.blink,.pulse { animation: none !important; opacity: 1 }
      .rule { stroke-dashoffset: 0 } .sheen { display: none }
    }
  </style>
  <g class="card">
    <rect x="1" y="1" width="238" height="191" rx="12" fill="var(--card)" stroke="url(#rim)" stroke-width="2"/>
    <g clip-path="url(#clip)">
      <rect x="0" y="0" width="240" height="4" fill="#F7DF1E"/>
      <rect x="0" y="0" width="240" height="64" fill="#F7DF1E" fill-opacity=".06"/>
      <g class="sheen"><rect x="0" y="0" width="70" height="193" fill="url(#glare)" transform="skewX(-20)"/></g>
    </g>
    <rect x="14" y="16" width="30" height="30" rx="7" fill="#F7DF1E"/>
    <path transform="translate(20 22) scale(0.7500)" fill="#1F2328" d="M0 0h24v24H0V0zm22.034 18.276c-.175-1.095-.888-2.015-3.003-2.873-.736-.345-1.554-.585-1.797-1.14-.091-.33-.105-.51-.046-.705.15-.646.915-.84 1.515-.66.39.12.75.42.976.9 1.034-.676 1.034-.676 1.755-1.125-.27-.42-.404-.601-.586-.78-.63-.705-1.469-1.065-2.834-1.034l-.705.089c-.676.165-1.32.525-1.71 1.005-1.14 1.291-.811 3.541.569 4.471 1.365 1.02 3.361 1.244 3.616 2.205.24 1.17-.87 1.545-1.966 1.41-.811-.18-1.26-.586-1.755-1.336l-1.83 1.051c.21.48.45.689.81 1.109 1.74 1.756 6.09 1.666 6.871-1.004.029-.09.24-.705.074-1.65l.046.067zm-8.983-7.245h-2.248c0 1.938-.009 3.864-.009 5.805 0 1.232.063 2.363-.138 2.711-.33.689-1.18.601-1.566.48-.396-.196-.597-.466-.83-.855-.063-.105-.11-.196-.127-.196l-1.825 1.125c.305.63.75 1.172 1.324 1.517.855.51 2.004.675 3.207.405.783-.226 1.458-.691 1.811-1.411.51-.93.402-2.07.397-3.346.012-2.054 0-4.109 0-6.179l.004-.056z"/>
    <text x="54" y="29" class="t">JavaScript</text>
    <rect x="54" y="35" width="67" height="13" rx="6.5" fill="#F7DF1E" fill-opacity=".14"/>
    <text x="61" y="44.5" class="k" fill="#F7DF1E">LANGUAGE</text>
    <circle class="pulse" cx="222" cy="22" r="3" fill="#F7DF1E"/>
    <line class="rule" x1="14" y1="60" x2="226" y2="60" stroke="url(#rim)" stroke-width="1.5" stroke-linecap="round"/>
    <text x="14" y="80" class="d in" style="animation-delay:0.35s">Demo UIs that put research models in</text>
    <text x="14" y="96" class="d in" style="animation-delay:0.42s">front of people.</text>
    <rect class="blink" x="105" y="87" width="6" height="11" rx="1" fill="#F7DF1E" opacity=".8"/>
    <text x="14" y="122" class="k in" fill="var(--dim)" style="animation-delay:0.49s">USED IN</text>
    <g class="pop" style="animation-delay:0.57s"><rect x="14" y="131" width="128" height="20" rx="10" fill="var(--chip)" stroke="#F7DF1E" stroke-opacity=".55"/><circle cx="24" cy="141" r="2.6" fill="#F7DF1E"/><text x="31" y="144.5" class="c">KLTN-Token-Merging</text></g>
    <g class="pop" style="animation-delay:0.65s"><rect x="14" y="157" width="104" height="20" rx="10" fill="var(--chip)" stroke="#F7DF1E" stroke-opacity=".55"/><circle cx="24" cy="167" r="2.6" fill="#F7DF1E"/><text x="31" y="170.5" class="c">CXR-VQA-custom</text></g>
  </g>
</svg>
