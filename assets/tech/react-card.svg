<svg xmlns="http://www.w3.org/2000/svg" width="240" height="203" viewBox="0 0 240 203" role="img" aria-label="React: Demo and product frontends.">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" style="stop-color:#61DAFB"/>
      <stop offset="50%" style="stop-color:var(--ac)"/>
      <stop offset="100%" style="stop-color:#61DAFB"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="238" height="201" rx="12"/></clipPath>
  </defs>
  <style>
    svg { --card:#FFFFFF; --ink:#1F2328; --tx:#3D4752; --dim:#6E7781; --chip:#F3F6FA; --ac:#0B6FD4 }
    @media (prefers-color-scheme: dark) {
      svg { --card:#111826; --ink:#F0F6FC; --tx:#C3CDD8; --dim:#8B949E; --chip:#1A2333; --ac:#36BCF7 }
    }
    .t  { font: 700 15px 'Segoe UI',Ubuntu,-apple-system,sans-serif; fill: var(--ink) }
    .d  { font: 400 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif; fill: var(--tx) }
    .k  { font: 700 8.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace; letter-spacing: 1.4px }
    .c  { font: 500 9.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace; fill: var(--ink) }
    .mn { font: 800 10px 'Segoe UI',Ubuntu,-apple-system,sans-serif }

    /* Entrance: the card settles, the rule draws, lines and chips follow. */
    .card { animation: card .55s cubic-bezier(.2,.8,.2,1) both }
    @keyframes card { from { opacity:0; transform: translateY(-8px) scale(.97) } to { opacity:1; transform:none } }
    .in   { opacity:0; animation: in .45s cubic-bezier(.2,.8,.2,1) both }
    @keyframes in { from { opacity:0; transform: translateX(-6px) } to { opacity:1; transform:none } }
    .pop  { opacity:0; transform-box: fill-box; transform-origin: center;
            animation: pop .4s cubic-bezier(.34,1.56,.64,1) both }
    @keyframes pop { from { opacity:0; transform: scale(.6) } to { opacity:1; transform:none } }
    .rule { stroke-dasharray: 212; stroke-dashoffset: 212; animation: draw .7s .25s cubic-bezier(.3,.7,.4,1) forwards }
    @keyframes draw { to { stroke-dashoffset: 0 } }

    /* Ambient, so the card still feels alive after the entrance has played. */
    .sheen { animation: sheen 3.6s 1s ease-in-out infinite }
    @keyframes sheen { 0% { transform: translateX(-120px) } 55%,100% { transform: translateX(380px) } }
    .blink { animation: blink 1.1s steps(1) infinite }
    @keyframes blink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-in-out infinite }
    @keyframes pulse { 0%,100% { opacity:.35; transform: scale(1) } 50% { opacity:1; transform: scale(1.35) } }

    @media (prefers-reduced-motion: reduce) {
      .card,.in,.pop,.rule,.sheen,.blink,.pulse { animation: none !important; opacity: 1 }
      .rule { stroke-dashoffset: 0 } .sheen { display: none }
    }
  </style>
  <g class="card">
    <rect x="1" y="1" width="238" height="201" rx="12" fill="var(--card)" stroke="url(#rim)" stroke-width="2"/>
    <g clip-path="url(#clip)">
      <rect x="0" y="0" width="240" height="4" fill="#61DAFB"/>
      <rect x="0" y="0" width="240" height="64" fill="#61DAFB" fill-opacity=".06"/>
      <g class="sheen"><rect x="0" y="0" width="70" height="203" fill="url(#glare)" transform="skewX(-20)"/></g>
    </g>
    <rect x="14" y="16" width="30" height="30" rx="7" fill="#61DAFB"/>
    <path transform="translate(20 22) scale(0.7500)" fill="#1F2328" d="M14.23 12.004a2.236 2.236 0 0 1-2.235 2.236 2.236 2.236 0 0 1-2.236-2.236 2.236 2.236 0 0 1 2.235-2.236 2.236 2.236 0 0 1 2.236 2.236zm2.648-10.69c-1.346 0-3.107.96-4.888 2.622-1.78-1.653-3.542-2.602-4.887-2.602-.41 0-.783.093-1.106.278-1.375.793-1.683 3.264-.973 6.365C1.98 8.917 0 10.42 0 12.004c0 1.59 1.99 3.097 5.043 4.03-.704 3.113-.39 5.588.988 6.38.32.187.69.275 1.102.275 1.345 0 3.107-.96 4.888-2.624 1.78 1.654 3.542 2.603 4.887 2.603.41 0 .783-.09 1.106-.275 1.374-.792 1.683-3.263.973-6.365C22.02 15.096 24 13.59 24 12.004c0-1.59-1.99-3.097-5.043-4.032.704-3.11.39-5.587-.988-6.38-.318-.184-.688-.277-1.092-.278zm-.005 1.09v.006c.225 0 .406.044.558.127.666.382.955 1.835.73 3.704-.054.46-.142.945-.25 1.44-.96-.236-2.006-.417-3.107-.534-.66-.905-1.345-1.727-2.035-2.447 1.592-1.48 3.087-2.292 4.105-2.295zm-9.77.02c1.012 0 2.514.808 4.11 2.28-.686.72-1.37 1.537-2.02 2.442-1.107.117-2.154.298-3.113.538-.112-.49-.195-.964-.254-1.42-.23-1.868.054-3.32.714-3.707.19-.09.4-.127.563-.132zm4.882 3.05c.455.468.91.992 1.36 1.564-.44-.02-.89-.034-1.345-.034-.46 0-.915.01-1.36.034.44-.572.895-1.096 1.345-1.565zM12 8.1c.74 0 1.477.034 2.202.093.406.582.802 1.203 1.183 1.86.372.64.71 1.29 1.018 1.946-.308.655-.646 1.31-1.013 1.95-.38.66-.773 1.288-1.18 1.87-.728.063-1.466.098-2.21.098-.74 0-1.477-.035-2.202-.093-.406-.582-.802-1.204-1.183-1.86-.372-.64-.71-1.29-1.018-1.946.303-.657.646-1.313 1.013-1.954.38-.66.773-1.286 1.18-1.868.728-.064 1.466-.098 2.21-.098zm-3.635.254c-.24.377-.48.763-.704 1.16-.225.39-.435.782-.635 1.174-.265-.656-.49-1.31-.676-1.947.64-.15 1.315-.283 2.015-.386zm7.26 0c.695.103 1.365.23 2.006.387-.18.632-.405 1.282-.66 1.933-.2-.39-.41-.783-.64-1.174-.225-.392-.465-.774-.705-1.146zm3.063.675c.484.15.944.317 1.375.498 1.732.74 2.852 1.708 2.852 2.476-.005.768-1.125 1.74-2.857 2.475-.42.18-.88.342-1.355.493-.28-.958-.646-1.956-1.1-2.98.45-1.017.81-2.01 1.085-2.964zm-13.395.004c.278.96.645 1.957 1.1 2.98-.45 1.017-.812 2.01-1.086 2.964-.484-.15-.944-.318-1.37-.5-1.732-.737-2.852-1.706-2.852-2.474 0-.768 1.12-1.742 2.852-2.476.42-.18.88-.342 1.356-.494zm11.678 4.28c.265.657.49 1.312.676 1.948-.64.157-1.316.29-2.016.39.24-.375.48-.762.705-1.158.225-.39.435-.788.636-1.18zm-9.945.02c.2.392.41.783.64 1.175.23.39.465.772.705 1.143-.695-.102-1.365-.23-2.006-.386.18-.63.406-1.282.66-1.933zM17.92 16.32c.112.493.2.968.254 1.423.23 1.868-.054 3.32-.714 3.708-.147.09-.338.128-.563.128-1.012 0-2.514-.807-4.11-2.28.686-.72 1.37-1.536 2.02-2.44 1.107-.118 2.154-.3 3.113-.54zm-11.83.01c.96.234 2.006.415 3.107.532.66.905 1.345 1.727 2.035 2.446-1.595 1.483-3.092 2.295-4.11 2.295-.22-.005-.406-.05-.553-.132-.666-.38-.955-1.834-.73-3.703.054-.46.142-.944.25-1.438zm4.56.64c.44.02.89.034 1.345.034.46 0 .915-.01 1.36-.034-.44.572-.895 1.095-1.345 1.565-.455-.47-.91-.993-1.36-1.565z"/>
    <text x="54" y="29" class="t">React</text>
    <rect x="54" y="35" width="47" height="13" rx="6.5" fill="#61DAFB" fill-opacity=".14"/>
    <text x="61" y="44.5" class="k" fill="#61DAFB">INFRA</text>
    <circle class="pulse" cx="222" cy="22" r="3" fill="#61DAFB"/>
    <line class="rule" x1="14" y1="60" x2="226" y2="60" stroke="url(#rim)" stroke-width="1.5" stroke-linecap="round"/>
    <text x="14" y="80" class="d in" style="animation-delay:0.35s">Demo and product frontends.</text>
    <rect class="blink" x="165" y="71" width="6" height="11" rx="1" fill="#61DAFB" opacity=".8"/>
    <text x="14" y="106" class="k in" fill="var(--dim)" style="animation-delay:0.42s">USED IN</text>
    <g class="pop" style="animation-delay:0.50s"><rect x="14" y="115" width="128" height="20" rx="10" fill="var(--chip)" stroke="#61DAFB" stroke-opacity=".55"/><circle cx="24" cy="125" r="2.6" fill="#61DAFB"/><text x="31" y="128.5" class="c">KLTN-Token-Merging</text></g>
    <g class="pop" style="animation-delay:0.58s"><rect x="14" y="141" width="104" height="20" rx="10" fill="var(--chip)" stroke="#61DAFB" stroke-opacity=".55"/><circle cx="24" cy="151" r="2.6" fill="#61DAFB"/><text x="31" y="154.5" class="c">CXR-VQA-custom</text></g>
    <g class="pop" style="animation-delay:0.66s"><rect x="14" y="167" width="174" height="20" rx="10" fill="var(--chip)" stroke="#61DAFB" stroke-opacity=".55"/><circle cx="24" cy="177" r="2.6" fill="#61DAFB"/><text x="31" y="180.5" class="c">Smart-Warehouse-Management</text></g>
  </g>
</svg>
