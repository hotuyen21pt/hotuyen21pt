    <text x="54" y="29" class="t">Transformers</text>
    <rect x="54" y="35" width="60" height="13" rx="6.5" fill="#FFD21E" fill-opacity=".14"/>
    <text x="61" y="44.5" class="k" fill="#FFD21E">ML / DL</text>
    <circle class="pulse" cx="222" cy="22" r="3" fill="#FFD21E"/>
