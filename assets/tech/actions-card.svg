<svg xmlns="http://www.w3.org/2000/svg" width="240" height="167" viewBox="0 0 240 167" role="img" aria-label="GH Actions: CI for the OCR API, and the daily job that renders this profile&#x27;s cards.">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" style="stop-color:#2088FF"/>
      <stop offset="50%" style="stop-color:var(--ac)"/>
      <stop offset="100%" style="stop-color:#2088FF"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="238" height="165" rx="12"/></clipPath>
  </defs>
  <style>
    svg { --card:#FFFFFF; --ink:#1F2328; --tx:#3D4752; --dim:#6E7781; --chip:#F3F6FA; --ac:#0B6FD4 }
    @media (prefers-color-scheme: dark) {
      svg { --card:#111826; --ink:#F0F6FC; --tx:#C3CDD8; --dim:#8B949E; --chip:#1A2333; --ac:#36BCF7 }
    }
    .t  { font: 700 15px 'Segoe UI',Ubuntu,-apple-system,sans-serif; fill: var(--ink) }
    .d  { font: 400 11.5px 'Segoe UI',Ubuntu,-apple-system,sans-serif; fill: var(--tx) }
    .k  { font: 700 8.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace; letter-spacing: 1.4px }
    .c  { font: 500 9.5px 'JetBrains Mono','Cascadia Code',Consolas,monospace; fill: var(--ink) }
    .mn { font: 800 10px 'Segoe UI',Ubuntu,-apple-system,sans-serif }

    /* Entrance: the card settles, the rule draws, lines and chips follow. */
    .card { animation: card .55s cubic-bezier(.2,.8,.2,1) both }
    @keyframes card { from { opacity:0; transform: translateY(-8px) scale(.97) } to { opacity:1; transform:none } }
    .in   { opacity:0; animation: in .45s cubic-bezier(.2,.8,.2,1) both }
    @keyframes in { from { opacity:0; transform: translateX(-6px) } to { opacity:1; transform:none } }
    .pop  { opacity:0; transform-box: fill-box; transform-origin: center;
            animation: pop .4s cubic-bezier(.34,1.56,.64,1) both }
    @keyframes pop { from { opacity:0; transform: scale(.6) } to { opacity:1; transform:none } }
    .rule { stroke-dasharray: 212; stroke-dashoffset: 212; animation: draw .7s .25s cubic-bezier(.3,.7,.4,1) forwards }
    @keyframes draw { to { stroke-dashoffset: 0 } }

    /* Ambient, so the card still feels alive after the entrance has played. */
    .sheen { animation: sheen 3.6s 1s ease-in-out infinite }
    @keyframes sheen { 0% { transform: translateX(-120px) } 55%,100% { transform: translateX(380px) } }
    .blink { animation: blink 1.1s steps(1) infinite }
    @keyframes blink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-in-out infinite }
    @keyframes pulse { 0%,100% { opacity:.35; transform: scale(1) } 50% { opacity:1; transform: scale(1.35) } }

    @media (prefers-reduced-motion: reduce) {
      .card,.in,.pop,.rule,.sheen,.blink,.pulse { animation: none !important; opacity: 1 }
      .rule { stroke-dashoffset: 0 } .sheen { display: none }
    }
  </style>
  <g class="card">
    <rect x="1" y="1" width="238" height="165" rx="12" fill="var(--card)" stroke="url(#rim)" stroke-width="2"/>
    <g clip-path="url(#clip)">
      <rect x="0" y="0" width="240" height="4" fill="#2088FF"/>
      <rect x="0" y="0" width="240" height="64" fill="#2088FF" fill-opacity=".06"/>
      <g class="sheen"><rect x="0" y="0" width="70" height="167" fill="url(#glare)" transform="skewX(-20)"/></g>
    </g>
    <rect x="14" y="16" width="30" height="30" rx="7" fill="#2088FF"/>
    <path transform="translate(20 22) scale(0.7500)" fill="#FFFFFF" d="M10.984 13.836a.5.5 0 0 1-.353-.146l-.745-.743a.5.5 0 1 1 .706-.708l.392.391 1.181-1.18a.5.5 0 0 1 .708.707l-1.535 1.533a.504.504 0 0 1-.354.146zm9.353-.147l1.534-1.532a.5.5 0 0 0-.707-.707l-1.181 1.18-.392-.391a.5.5 0 1 0-.706.708l.746.743a.497.497 0 0 0 .706-.001zM4.527 7.452l2.557-1.585A1 1 0 0 0 7.09 4.17L4.533 2.56A1 1 0 0 0 3 3.406v3.196a1.001 1.001 0 0 0 1.527.85zm2.03-2.436L4 6.602V3.406l2.557 1.61zM24 12.5c0 1.93-1.57 3.5-3.5 3.5a3.503 3.503 0 0 1-3.46-3h-2.08a3.503 3.503 0 0 1-3.46 3 3.502 3.502 0 0 1-3.46-3h-.558c-.972 0-1.85-.399-2.482-1.042V17c0 1.654 1.346 3 3 3h.04c.244-1.693 1.7-3 3.46-3 1.93 0 3.5 1.57 3.5 3.5S13.43 24 11.5 24a3.502 3.502 0 0 1-3.46-3H8c-2.206 0-4-1.794-4-4V9.899A5.008 5.008 0 0 1 0 5c0-2.757 2.243-5 5-5s5 2.243 5 5a5.005 5.005 0 0 1-4.952 4.998A2.482 2.482 0 0 0 7.482 12h.558c.244-1.693 1.7-3 3.46-3a3.502 3.502 0 0 1 3.46 3h2.08a3.503 3.503 0 0 1 3.46-3c1.93 0 3.5 1.57 3.5 3.5zm-15 8c0 1.378 1.122 2.5 2.5 2.5s2.5-1.122 2.5-2.5-1.122-2.5-2.5-2.5S9 19.122 9 20.5zM5 9c2.206 0 4-1.794 4-4S7.206 1 5 1 1 2.794 1 5s1.794 4 4 4zm9 3.5c0-1.378-1.122-2.5-2.5-2.5S9 11.122 9 12.5s1.122 2.5 2.5 2.5 2.5-1.122 2.5-2.5zm9 0c0-1.378-1.122-2.5-2.5-2.5S18 11.122 18 12.5s1.122 2.5 2.5 2.5 2.5-1.122 2.5-2.5zm-13 8a.5.5 0 1 0 1 0 .5.5 0 0 0-1 0zm2 0a.5.5 0 1 0 1 0 .5.5 0 0 0-1 0zm12 0c0 1.93-1.57 3.5-3.5 3.5a3.503 3.503 0 0 1-3.46-3.002c-.007.001-.013.005-.021.005l-.506.017h-.017a.5.5 0 0 1-.016-.999l.506-.017c.018-.002.035.006.052.007A3.503 3.503 0 0 1 20.5 17c1.93 0 3.5 1.57 3.5 3.5zm-1 0c0-1.378-1.122-2.5-2.5-2.5S18 19.122 18 20.5s1.122 2.5 2.5 2.5 2.5-1.122 2.5-2.5z"/>
    <text x="54" y="29" class="t">GH Actions</text>
    <rect x="54" y="35" width="47" height="13" rx="6.5" fill="#2088FF" fill-opacity=".14"/>
    <text x="61" y="44.5" class="k" fill="#2088FF">INFRA</text>
    <circle class="pulse" cx="222" cy="22" r="3" fill="#2088FF"/>
    <line class="rule" x1="14" y1="60" x2="226" y2="60" stroke="url(#rim)" stroke-width="1.5" stroke-linecap="round"/>
    <text x="14" y="80" class="d in" style="animation-delay:0.35s">CI for the OCR API, and the daily job</text>
    <text x="14" y="96" class="d in" style="animation-delay:0.42s">that renders this profile&#x27;s cards.</text>
    <rect class="blink" x="203" y="87" width="6" height="11" rx="1" fill="#2088FF" opacity=".8"/>
    <text x="14" y="122" class="k in" fill="var(--dim)" style="animation-delay:0.49s">USED IN</text>
    <g class="pop" style="animation-delay:0.57s"><rect x="14" y="131" width="87" height="20" rx="10" fill="var(--chip)" stroke="#2088FF" stroke-opacity=".55"/><circle cx="24" cy="141" r="2.6" fill="#2088FF"/><text x="31" y="144.5" class="c">Detect-CCCD</text></g>
    <g class="pop" style="animation-delay:0.65s"><rect x="107.25" y="131" width="87" height="20" rx="10" fill="var(--chip)" stroke="#2088FF" stroke-opacity=".55"/><circle cx="117.25" cy="141" r="2.6" fill="#2088FF"/><text x="124.25" y="144.5" class="c">hotuyen21pt</text></g>
  </g>
</svg>
