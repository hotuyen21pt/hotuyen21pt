<svg xmlns="http://www.w3.org/2000/svg" width="830" height="78" viewBox="0 0 830 78" role="img" aria-label="24 public repositories · 3 paper reproductions · 275+ tests passing · 1.95M reviews analysed">
  <style>
    svg {
      --bg:#FFFFFF; --panel:#F6F8FA; --bd:#D8DEE4; --tx:#1F2328; --mu:#636C76;
      --ac:#0B6FD4; --hi:#6A3DE8;
      --l0:#E7ECF2; --l1:#BDDCF5; --l2:#6FB7EB; --l3:#2E8FD6; --l4:#0B5FB8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg:#0D1117; --panel:#111823; --bd:#1E3A52; --tx:#C9D1D9; --mu:#8B949E;
        --ac:#36BCF7; --hi:#9D7BFF;
        --l0:#161B22; --l1:#0E3A5C; --l2:#1569A3; --l3:#2E9BE0; --l4:#7FE3FF;
      }
