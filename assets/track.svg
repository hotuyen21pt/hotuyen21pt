  <g class="pop" style="animation-delay:0.20s"><rect x="211.0" y="1" width="198.0" height="76" rx="12" fill="var(--panel)" stroke="var(--bd)"/><rect x="211.0" y="14" width="3" height="50" rx="1.5" fill="var(--hi)"/><text x="231.0" y="41" class="num" fill="var(--hi)">3</text><text x="231.0" y="60" class="lbl">paper reproductions</text></g>
  <g class="pop" style="animation-delay:0.30s"><rect x="421.0" y="1" width="198.0" height="76" rx="12" fill="var(--panel)" stroke="var(--bd)"/><rect x="421.0" y="14" width="3" height="50" rx="1.5" fill="var(--ac)"/><text x="441.0" y="41" class="num" fill="var(--ac)">275+</text><text x="441.0" y="60" class="lbl">tests passing</text></g>
