name: Update stat cards

# The public github-readme-stats, streak-stats and activity-graph deployments
# answer 503 and 402, so every card is rendered here instead and committed as a
# plain SVG the README links by relative path.
#
# The contribution grid comes from GraphQL, which needs a token. GITHUB_TOKEN
# normally covers public contributions; if the job logs "GraphQL 401/403",
# add a classic PAT with `read:user` as the PROFILE_TOKEN secret.

on:
  push:
    branches: [main]
    paths: ['scripts/gen_stats.py', '.github/workflows/update-stats.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render SVG cards
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/gen_stats.py

      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets README.md
          git diff --staged --quiet && echo 'no change' && exit 0
          git commit -m 'chore: refresh stat cards'
          git push
