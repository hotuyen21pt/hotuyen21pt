name: Contribution snake

# Renders the contribution grid as an animated snake and pushes the SVGs to the
# `output` branch, which the README links. Nothing is served by a third party.

on:
  schedule:
    - cron: '23 */12 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Render snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#36BCF7&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353
            dist/github-snake-light.svg?palette=github-light&color_snake=#0B6FD4

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
